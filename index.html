<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Canlı Nöbet Tabelası</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 9px 10px 78px 10px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Bölüm Ayırıcı Etiketler */
    .bolum-ayirici {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 800;
      color: #334155;
      letter-spacing: 0.5px;
      margin: 12px 2px 6px 2px;
      padding-top: 8px;
      border-top: 1.5px solid #cbd5e1;
    }
    .bolum-ayirici.ilk-bolum {
      margin-top: 2px;
      padding-top: 0;
      border-top: none;
    }
    .bolum-baslik-metin {
      text-transform: uppercase;
    }
    .bolum-zaman-etiket {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.1px;
      text-transform: none;
    }

    .nakit-serit {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 7px 11px;
      margin-bottom: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: #64748b;
    }

    /* Kartlar */
    .kart {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-left-width: 5px;
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    /* Birleşik ve Simetrik Mavi Çerçeveli Ana Piyasa Bloğu (Başlık + ONS ─── ◆ ─── BİST 30) */
    .ana-piyasa-cerceve {
      background: #f5f9fd;
      border: 1.5px solid #0284c7;
      border-radius: 12px;
      margin: 2px 0 11px 0;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(2, 132, 199, 0.08);
    }
    .bolum-ayirici.cerceve-sonrasi {
      margin-top: 10px;
      padding-top: 0;
      border-top: none;
    }
    .ana-piyasa-baslik {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 11px 8.5px 13px;
      font-size: 13.2px;
      font-weight: 900;
      color: #075985;
      letter-spacing: 0.45px;
      text-transform: uppercase;
      background: rgba(224, 242, 254, 0.78);
      border-bottom: 1.3px solid rgba(2, 132, 199, 0.28);
    }
    .ana-piyasa-baslik-metin {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      line-height: 1.2;
    }
    .ana-piyasa-aksiyon-grup {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      text-transform: none;
    }
    .ana-piyasa-aksiyon-grup .kart-boyut-btn {
      padding: 5px 9.5px;
      font-size: 12.5px;
      min-width: 42px;
      border-radius: 9px;
      background: #ffffff;
    }
    .ana-piyasa-aksiyon-grup .kart-boyut-btn.buyutuldu {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #075985;
    }
    .tumu-ac-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #0369a1;
      border: 1.3px solid #38bdf8;
      border-radius: 9px;
      padding: 5px 13px;
      font-size: 12.8px;
      font-weight: 800;
      letter-spacing: 0.15px;
      text-transform: none;
      cursor: pointer;
      line-height: 1.15;
      box-shadow: 0 1px 2px rgba(2, 132, 199, 0.10);
      transition: background-color 0.14s ease, transform 0.12s ease;
    }
    .tumu-ac-btn:active {
      background: #e0f2fe;
      transform: scale(0.95);
    }
    .tumu-ac-btn.aktif-sinyal-var {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }
    .ana-piyasa-satir {
      padding: 7px 12px 7.5px 12px;
    }
    .ana-piyasa-ayirici {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      margin: 0;
      user-select: none;
    }
    .ana-piyasa-ayirici::before,
    .ana-piyasa-ayirici::after {
      content: "";
      flex: 1;
      height: 1px;
    }
    .ana-piyasa-ayirici::before {
      background: linear-gradient(to right, rgba(2, 132, 199, 0.08), rgba(2, 132, 199, 0.48));
    }
    .ana-piyasa-ayirici::after {
      background: linear-gradient(to left, rgba(2, 132, 199, 0.08), rgba(2, 132, 199, 0.48));
    }
    .ana-piyasa-elmas {
      font-size: 9px;
      line-height: 1;
      color: #0284c7;
      opacity: 0.9;
    }
    .kart-re {
      background: #eef2ff;
      border-color: #c7d2fe;
      border-left: 5px solid #6366f1;
    }

    .cerceve-notr         { border-color: #cbd5e1; border-left-color: #64748b; }
    .cerceve-pozitif      { border-color: #86efac; border-left-color: #16a34a; background: #f0fdf4; }
    .cerceve-short-sinyal { border-color: #fca5a5; border-left-color: #dc2626; background: #fef2f2; }
    .cerceve-uyari        { border-color: #fcd34d; border-left-color: #d97706; background: #fffbeb; }
    .cerceve-kritik  {
      border-color: #fca5a5;
      border-left-color: #dc2626;
      background: #fef2f2;
      animation: nabiz 1.6s infinite;
    }
    @keyframes nabiz {
      0%, 100% { box-shadow: 0 1px 3px rgba(220, 38, 38, 0.12); }
      50% { box-shadow: 0 0 14px rgba(220, 38, 38, 0.45); }
    }

    .ust-satir {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sembol-grup {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .sembol-baslik {
      font-size: 18.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: #0f172a;
    }
    .ana-piyasa-satir .sembol-baslik {
      font-size: 16.8px;
      font-weight: 800;
      color: #1e293b;
    }
    .ana-piyasa-satir .ons-fiyat-metin {
      font-size: 15.8px;
      font-weight: 800;
      color: #0369a1;
    }
    .ons-fiyat-metin {
      font-size: 16.5px;
      font-weight: 900;
      color: #0369a1;
    }
    .kart-zaman-etiket {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
      margin-left: auto;
    }

    /* 3'lü Kompakt Yön & Güç Rozetleri: [K] [%Güç] [60dk] */
    .yon-rozet-grup {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .yon-rozet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }
    .rozet-yesil {
      color: #16a34a;
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(22, 163, 74, 0.32);
    }
    .rozet-kirmizi {
      color: #dc2626;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.32);
    }
    .rozet-gri {
      color: #6b7280;
      background-color: rgba(156, 163, 175, 0.15);
      border: 1px solid rgba(107, 114, 128, 0.28);
    }
    body.koyu-tema .rozet-yesil, [data-theme="dark"] .rozet-yesil { color: #4ade80; }
    body.koyu-tema .rozet-kirmizi, [data-theme="dark"] .rozet-kirmizi { color: #f87171; }
    body.koyu-tema .rozet-gri, [data-theme="dark"] .rozet-gri { color: #9ca3af; }

    /* Günlük Değişim Alt Satırı + Sağ Zikzak Harita Butonu */
    .gunluk-degisim-satir {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.25;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-right: 0.6ch;
    }
    .ana-piyasa-satir .gunluk-degisim-satir {
      margin-top: 3px;
      font-size: 13.3px;
    }
    .gunluk-degisim-sol {
      min-width: 0;
    }
    .gunluk-degisim-etiket {
      color: #475569;
      font-weight: 700;
    }
    .gunluk-degisim-oran {
      font-weight: 800;
    }
    .zikzak-harita-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e0f2fe;
      border: 1.2px solid #7dd3fc;
      border-radius: 7px;
      padding: 3px 7px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
      transition: background-color 0.14s ease, transform 0.12s ease;
    }
    .zikzak-harita-btn:active {
      background: #bae6fd;
      transform: scale(0.94);
    }

    /* ======================================================================
       AÇILIR POP-UP: BİRLEŞİK YAPI, OB & POZİSYON HARİTASI (15dk + 60dk)
       ====================================================================== */
    .harita-arka-perde {
      position: fixed;
      inset: 0;
      z-index: 115;
      background: rgba(15, 23, 42, 0.52);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .harita-arka-perde.acik {
      opacity: 1;
      pointer-events: auto;
    }
    .harita-modal {
      width: 100%;
      max-width: 450px;
      max-height: 92vh;
      background: #ffffff;
      border: 1.6px solid #94a3b8;
      border-radius: 18px;
      padding: 11px 12px 10px 12px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.28);
      display: flex;
      flex-direction: column;
      gap: 7px;
      transform: scale(0.96) translateY(8px);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }
    .harita-arka-perde.acik .harita-modal {
      transform: scale(1) translateY(0);
    }
    .harita-modal-ust {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .harita-modal-baslik {
      font-size: 14.5px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.25;
      min-width: 0;
    }
    .harita-kapat-btn {
      flex-shrink: 0;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      border-radius: 9px;
      padding: 5px 11px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1.1;
    }
    .harita-lejant {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
    }
    .harita-lejant-sabit {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #334155;
    }
    .harita-lejant-acik {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #475569;
    }
    .harita-lejant-re {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #334155;
    }
    .harita-svg-kutu {
      width: 100%;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
    }
    .harita-svg-kutu svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .harita-alt-not {
      font-size: 11px;
      font-style: italic;
      color: #64748b;
      text-align: center;
      line-height: 1.3;
      padding: 0 4px;
    }

    .kz-dev {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    .re-ust-satir {
      font-size: 17.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
      margin-bottom: 3px;
    }
    .re-sembol-satir {
      margin-top: 1px;
    }

    /* Keskin Renk Sınıfları */
    .renk-yesil   { color: #15803d; }
    .renk-kirmizi { color: #dc2626; }
    .renk-sari    { color: #b45309; }
    .renk-gri     { color: #475569; }
    .renk-mavi    { color: #0369a1; }

    .ic-dalga-satir {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.25;
    }
    .ana-piyasa-satir .ic-dalga-satir {
      margin-top: 2.5px;
      font-size: 14.2px;
    }
    .ana-piyasa-satir .alt-bilgi-satir {
      margin-top: 3px;
      font-size: 13px;
    }
    .alt-bilgi-satir {
      margin-top: 4px;
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
      line-height: 1.3;
    }

    /* ======================================================================
       ALTTAN YUKARI KAYDIRMALI HABER ÖZETİ ÇEKMECESİ
       ====================================================================== */
    .ozet-alt-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: #ffffff;
      border-top: 2px solid #0284c7;
      border-radius: 16px 16px 0 0;
      padding: 7px 15px calc(9px + env(safe-area-inset-bottom, 0px)) 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.12);
    }
    .cekmece-tutamac {
      width: 44px;
      height: 4.5px;
      border-radius: 999px;
      background: #94a3b8;
    }
    .ozet-alt-satir {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }
    .ozet-alt-ipucu {
      font-size: 13px;
      font-weight: 800;
      color: #0284c7;
    }

    .ozet-arka-perde {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(15, 23, 42, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .ozet-arka-perde.acik {
      opacity: 1;
      pointer-events: auto;
    }
    .ozet-cekmece {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      height: 89vh;
      max-height: 89vh;
      background: #f1f5f9;
      border-top: 3px solid #0284c7;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      transform: translateY(104%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.25);
    }
    .ozet-cekmece.acik {
      transform: translateY(0);
    }
    .ozet-cekmece-ust {
      padding: 9px 12px 10px 12px;
      border-bottom: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 18px 18px 0 0;
      touch-action: none;
    }
    .ozet-cekmece-ust-cubuk {
      display: flex;
      justify-content: center;
      margin-bottom: 7px;
    }
    .ozet-baslik-satir {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .ozet-ana-baslik {
      font-size: 16.5px;
      font-weight: 900;
      color: #0f172a;
      white-space: nowrap;
    }
    .ozet-buton-grup {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-shrink: 0;
    }
    .ozet-btn {
      background: #f0f9ff;
      color: #0369a1;
      border: 1px solid #7dd3fc;
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1.1;
    }
    .ozet-btn-boyut {
      min-width: 44px;
      text-align: center;
      letter-spacing: -0.2px;
    }
    .ozet-btn-boyut.buyutuldu {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #075985;
    }
    .ozet-btn-kapat {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #b91c1c;
    }

    /* Çekmece Gövdesi ve 3 Kademeli Yazı Boyutu Sınıfları */
    .ozet-icerik-alani {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 13px 13px calc(22px + env(safe-area-inset-bottom, 0px)) 13px;
      user-select: text;
      font-weight: 500;
      color: #1e293b;
    }
    .ozet-icerik-alani.boyut-normal {
      font-size: 17px;
      line-height: 1.56;
    }
    .ozet-icerik-alani.boyut-buyuk {
      font-size: 19.5px;
      line-height: 1.62;
    }
    .ozet-icerik-alani.boyut-cok-buyuk {
      font-size: 22px;
      line-height: 1.65;
    }

    /* Bölüm Başlıkları ve Madde Kartları */
    .ozet-bolum-baslik {
      font-size: 1.02em;
      font-weight: 900;
      color: #075985;
      background: #e0f2fe;
      border-left: 4px solid #0284c7;
      padding: 7px 11px;
      border-radius: 6px;
      margin: 12px 0 10px 0;
      letter-spacing: 0.3px;
    }
    .ozet-bolum-baslik:first-child {
      margin-top: 0;
    }
    .ozet-bolum-baslik-esnek {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-right: 1ch;
    }
    .ozet-strateji-sure {
      font-size: 0.76em;
      font-weight: 700;
      color: #0369a1;
      white-space: nowrap;
      letter-spacing: 0;
      margin-left: auto;
    }

    .ozet-madde {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      padding: 11px 13px;
      margin-bottom: 10px;
      color: #1e293b;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .ozet-madde-vurgu {
      color: #0369a1;
      font-weight: 800;
    }
    .ozet-paragraf {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      color: #1e293b;
    }
    .ozet-bilgi-mesaj {
      text-align: center;
      padding: 28px 12px;
      font-size: 15.5px;
      font-weight: 700;
      color: #475569;
    }

    /* ======================================================================
       TAM EKRAN TÜM BIST 30 RADAR ÇEKMECESİ / POP-UP KATMANI
       ====================================================================== */
    .tumu-cekmece {
      position: fixed;
      inset: 0;
      z-index: 105;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      transform: translateY(104%);
      pointer-events: none;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tumu-cekmece.acik {
      transform: translateY(0);
      pointer-events: auto;
    }
    .tumu-cekmece-ust {
      padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 9px 12px;
      background: #ffffff;
      border-bottom: 1.5px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      touch-action: none;
      flex-shrink: 0;
    }
    .tumu-baslik-grup {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .tumu-ana-baslik {
      font-size: 16px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
    }
    .tumu-alt-bilgi {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748b;
    }
    .tumu-icerik-alani {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 10px calc(26px + env(safe-area-inset-bottom, 0px)) 10px;
    }

    const YAZI_KADEMELERI = [
      { sinif: "boyut-normal",    etiket: "Aa" },

      { sinif: "boyut-cok-buyuk", etiket: "Aa++" }

      { sinif: "",              etiket: "Aa" },

    const HARITA_KADEMELERI = [
      { sinif: "",                etiket: "Aa" },
      { sinif: "harita-kademe-1", etiket: "Aa+" },
      { sinif: "harita-kademe-2", etiket: "Aa++" }

    let sonOzetCekimMs = 0;

    function yaziBoyutunuUygula(kademe) {
      const gecerli = (kademe >= 0 && kademe < YAZI_KADEMELERI.length) ? kademe : 0;

    function ozetYaziBoyutuDegistir(ev) {

        if (k.sinif) document.body.classList.remove(k.sinif);

    function kartYaziBoyutuDegistir(ev) {

    function haritaBoyutunuUygula(kademe) {

        HARITA_KADEMELERI.forEach(k => {
          if (k.sinif) modalEl.classList.remove(k.sinif);
        });
        if (HARITA_KADEMELERI[gecerli].sinif) {

    function haritaYaziBoyutuDegistir(ev) {
      if (ev) ev.stopPropagation();
      const yeniKademe = (aktifHaritaKademe + 1) % HARITA_KADEMELERI.length;

      try {
        localStorage.setItem("HARITA_YAZI_KADEME", String(yeniKademe));

      if (aktifHaritaAnahtar) {

        if (guncelIdx >= 0) haritaIceriginiCiz(ekranKartlari[guncelIdx]);
      }
    }

    (function kayitliBoyutlariYukle() {
      try {
        const kOzet = parseInt(localStorage.getItem("OZET_YAZI_KADEME") || "0", 10);
        if (!isNaN(kOzet)) yaziBoyutunuUygula(kOzet);

      try {
        const kKart = parseInt(localStorage.getItem("KART_YAZI_KADEME") || "0", 10);
        if (!isNaN(kKart)) kartBoyutunuUygula(kKart);

        const kHarita = parseInt(localStorage.getItem("HARITA_YAZI_KADEME") || "0", 10);
        if (!isNaN(kHarita)) haritaBoyutunuUygula(kHarita);

    })();

    // =========================================================================
    // ZAMAN AYRIŞTIRICI VE "50 sn önce / 2 dk önce / 1 saat önce" HESAPLAYICI
    // =========================================================================
    function zamanMsCoz(hamZaman) {
      if (hamZaman === null || hamZaman === undefined || hamZaman === "") return null;
      if (typeof hamZaman === "number" && !isNaN(hamZaman)) {
        return hamZaman > 1e11 ? hamZaman : hamZaman * 1000;
      }
      const s = String(hamZaman).trim();
      if (!s || s === "-") return null;

      if (/^\d{9,13}$/.test(s)) {
        const n = Number(s);
        return n > 1e11 ? n : n * 1000;
      }

      // Format 1: "23.11.2026 17:58" veya "23.11.2026 17:58:10"
      const mTr = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (mTr) {
        const gun = mTr[1].padStart(2, "0");
        const ay  = mTr[2].padStart(2, "0");
        const yil = mTr[3];
        const sa  = mTr[4].padStart(2, "0");
        const dk  = mTr[5].padStart(2, "0");
        const sn  = (mTr[6] || "00").padStart(2, "0");
        const ms = Date.parse(`${yil}-${ay}-${gun}T${sa}:${dk}:${sn}+03:00`);
        if (!isNaN(ms)) return ms;
      }

      // Format 2: "2026-11-23 17:58:10"
      const mIso = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (mIso) {
        const yil = mIso[1];
        const ay  = mIso[2].padStart(2, "0");
        const gun = mIso[3].padStart(2, "0");
        const sa  = mIso[4].padStart(2, "0");
        const dk  = mIso[5].padStart(2, "0");
        const sn  = (mIso[6] || "00").padStart(2, "0");
        const ms = Date.parse(`${yil}-${ay}-${gun}T${sa}:${dk}:${sn}+03:00`);
        if (!isNaN(ms)) return ms;
      }

      // Format 3: Sadece "22:20" veya "22:20:15"
      const mSaat = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (mSaat) {
        const simdi = new Date();
        const aday = new Date(
          simdi.getFullYear(),
          simdi.getMonth(),
          simdi.getDate(),
          Number(mSaat[1]),
          Number(mSaat[2]),
          Number(mSaat[3] || 0)
        );
        if (aday.getTime() - simdi.getTime() > 5 * 60 * 1000) {
          aday.setDate(aday.getDate() - 1);
        }
        return aday.getTime();
      }

      const dogrudan = Date.parse(s);
      return isNaN(dogrudan) ? null : dogrudan;
    }

    function gecenSureMetni(hamZaman) {
      const hedefMs = zamanMsCoz(hamZaman);
      if (!hedefMs) return "";
      const farkSn = Math.max(0, Math.floor((Date.now() - hedefMs) / 1000));
      if (farkSn < 5) return "Az önce";
      if (farkSn < 60) return `${farkSn} sn önce`;
      const farkDk = Math.floor(farkSn / 60);
      if (farkDk < 60) return `${farkDk} dk önce`;
      const farkSaat = Math.floor(farkDk / 60);
      if (farkSaat < 24) return `${farkSaat} saat önce`;
      const farkGun = Math.floor(farkSaat / 24);
      return `${farkGun} gün önce`;
    }

    function canliSureEtiketleriniGuncelle() {
      document.querySelectorAll("[data-zaman]").forEach(el => {
        const ham = el.getAttribute("data-zaman") || "";
        const onEk = el.getAttribute("data-onek") || "";
        const metin = gecenSureMetni(ham);
        el.textContent = metin ? `${onEk}${metin}` : "";
      });
      altBarEtiketiniGuncelle();
    }

    function altBarEtiketiniGuncelle() {
      const altEtiketEl = document.getElementById("ozetAltEtiket");
      if (!altEtiketEl) return;
      if (sonCekilenPaket && sonCekilenPaket.zaman) {
        const sure = gecenSureMetni(sonCekilenPaket.zaman);
        altEtiketEl.textContent = sure ? `📄 Haber Özeti (${sure})` : "📄 Haber Özeti";
      } else {
        altEtiketEl.textContent = "📄 Haber Özeti";
      }
    }

    // =========================================================================
    // ROZET ([K] [15dk] [U]) VE KART BİÇİMLENDİRME YARDIMCILARI
    // =========================================================================
    function ucluEmojiDizisiniCoz(dizgi) {
      if (!dizgi) return null;
      const semboller = Array.from(String(dizgi)).filter(ch =>
        ch === "🟢" || ch === "🔴" || ch === "🔘" || ch === "⚪"
      );
      if (semboller.length < 3) return null;
      const renkCevir = (s) => s === "🟢" ? "rozet-yesil" : s === "🔴" ? "rozet-kirmizi" : "rozet-gri";
      return [renkCevir(semboller[0]), renkCevir(semboller[1]), renkCevir(semboller[2])];
    }

    function ucluRozetHtmlUret(kayit) {
      const ucluYedek = ucluEmojiDizisiniCoz(kayit.ucSimge || kayit.yonSimgeleri || "");

      // 1) [K] - Kısa / İç Dalga (8. sütun)
      const icMetin = String(kayit.icDalga || "");
      let renkK = "rozet-gri";
      if (icMetin) {
        if (/Long/i.test(icMetin) || icMetin.includes("↗")) renkK = "rozet-yesil";
        else if (/Short/i.test(icMetin) || icMetin.includes("↘")) renkK = "rozet-kirmizi";
      } else if (ucluYedek) {
        renkK = ucluYedek[0];
      }

      // 2) [%Güç] - Orta / 15dk Ana SMC Yönü (5. sütun rengi + 7. sütun Güç Skoru)
      const anaMetin = String(kayit.anaYon || "");
      let renk15 = "rozet-gri";
      if (anaMetin) {
        if (anaMetin.includes("🟢") || /LONG/i.test(anaMetin)) renk15 = "rozet-yesil";
        else if (anaMetin.includes("🔴") || /SHORT/i.test(anaMetin)) renk15 = "rozet-kirmizi";
      } else if (ucluYedek) {
        renk15 = ucluYedek[1];
      }

      const gucHam = (kayit.guc !== undefined && kayit.guc !== null) ? kayit.guc : kayit.gucSkoru;
      let etiket15 = "15dk";
      if (typeof gucHam === "number" && !isNaN(gucHam)) {
        const puan = (gucHam > 0 && gucHam < 1) ? Math.round(gucHam * 100) : Math.round(gucHam);
        etiket15 = `%${puan}`;
      } else if (gucHam) {
        const mGuc = String(gucHam).match(/%?\s*(\d{1,3})/);
        if (mGuc) {
          etiket15 = `%${mGuc[1]}`;
        }
      }

      // 3) [60dk] - Uzun / 60dk Üst Yapı (4. sütun)
      const ustMetin = String(kayit.ustYapi || kayit.tf2Ozet || kayit.ustYon || "");
      let renk60 = "rozet-gri";
      if (ustMetin) {
        if (ustMetin.includes("🟢") || /L-BOS|L-CHOCH/i.test(ustMetin)) renk60 = "rozet-yesil";
        else if (ustMetin.includes("🔴") || /S-BOS|S-CHOCH/i.test(ustMetin)) renk60 = "rozet-kirmizi";
      } else if (ucluYedek) {
        renk60 = ucluYedek[2];
      }

      return `
        <span class="yon-rozet-grup">
          <span class="yon-rozet ${renkK}">K</span>
          <span class="yon-rozet ${renk15}" title="15dk Ana SMC Yönü &amp; Güç Skoru">${htmlGuvenliYap(etiket15)}</span>
          <span class="yon-rozet ${renk60}">60dk</span>
        </span>
      `;
    }

    function gunlukDegisimHtmlUret(fiyatStr, kartIdx, ekSolHtml) {
      const m = String(fiyatStr || "").match(/\(%?([+\-]?\d+(?:[.,]\d+)?)\)/);
      let solIcerik = `<span class="gunluk-degisim-etiket">Günlük:</span> <span class="gunluk-degisim-oran renk-gri">-</span>`;
      if (m) {
        const oran = m[1];
        const renk = oran.includes("+") ? "renk-yesil" : oran.includes("-") ? "renk-kirmizi" : "renk-gri";
        solIcerik = `<span class="gunluk-degisim-etiket">Günlük:</span> <span class="gunluk-degisim-oran ${renk}">% ${htmlGuvenliYap(oran)}</span>${ekSolHtml || ""}`;
      }
      const zikzakBtn = `
        <button type="button" class="zikzak-harita-btn" onclick="haritaPopAc(${kartIdx}, event)" title="Yapı &amp; OB Haritası" aria-label="Yapı ve OB Haritası">
          <svg viewBox="0 0 28 16" width="24" height="14" fill="none" aria-hidden="true">
            <polyline points="2,12.5 8.5,5.5 14.5,10.5 23,3.5" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></polyline>

    function hisseTlFiyatAyikla(fiyatStr) {
      const m = String(fiyatStr || "").match(/^\s*([\d.,]+)/);
      if (!m) return "";
      let ham = m[1];
      if (ham.includes(".") && ham.includes(",")) {
        ham = ham.replace(/\./g, "").replace(",", ".");
      } else if (ham.includes(",")) {
        ham = ham.replace(",", ".");
      }
      const sayi = parseFloat(ham);
      if (isNaN(sayi) || sayi <= 0) return "";
      return sayi >= 100 ? sayi.toFixed(1).replace(".", ",") : sayi.toFixed(2).replace(".", ",");
    }

    function rsEkHtmlUret(vwapAlfaStr) {
      if (!vwapAlfaStr) return "";
      const m = String(vwapAlfaStr).match(/RS:\s*%?([+\-]?\d+(?:[.,]\d+)?)/i);
      if (!m) return "";
      const val = parseFloat(m[1].replace(",", "."));
      if (isNaN(val)) return "";
      const renk = val >= 0.35 ? "renk-yesil" : val <= -0.35 ? "renk-kirmizi" : "renk-gri";
      return `<span class="rs-ek-metin ${renk}">· RS:%${htmlGuvenliYap(m[1])}</span>`;
    }

    // Faz 2 & Faz 3 Altyapı Yuvası: İleride VİOP fiyatı ve zımni faiz/makas verisi geldiğinde otomatik görünür
    function viopMakasBilgiHtmlUret(kayit) {
      if (!kayit || !kayit.viopAktif || !kayit.makasOzet) return "";
      return `<div class="viop-makas-satir">${htmlGuvenliYap(kayit.makasOzet)}</div>`;
    }

    // Hisseyi Alarm / Pusu önceliğine göre sınıflandırır:
    // seviye 1: Onaylı Giriş / Kopuş (🔥 A+ BOS, 🎯 ONAYLI PUSU, 🎯 AL-/SAT- formasyon)
    // seviye 2: Diğer Çekirdek Alarmlar (⚡ Hacimli BOS, Pusu Adayı, 🛡️/💎 ALARM-3)
    // seviye 3: Pusu Bölgesinde Bekleyenler (⏳ Pusu(L/S) veya 🛡️[Emilim])
    // seviye 9: Diğer Hisseler (Alfabetik A-Z grubu)
    function hisseAlarmPusuSiniflandir(h) {
      const pusuStr = String(h.pusu || "").trim();
      const alarmStr = String(h.alarmMetin || "").trim();
      const anaYonStr = String(h.anaYon || "").trim();
      const aPlusMu = /A\+\s*KURUMSAL\s*BOS|🔥/i.test(alarmStr) || anaYonStr.includes("🔥");
      const onayliFormasyonMu = pusuStr.startsWith("🎯") || /ALARM-1\s*\[ONAYLI\s*PUSU\]/i.test(alarmStr);
      const digerAlarmMi = Boolean(h.alarmVarMi) || /ALARM-[123]/i.test(alarmStr) || anaYonStr.includes("⚡");
      const pusuBekleyenMi = pusuStr.startsWith("⏳") || pusuStr.includes("[Emilim]");

      const shortYonMu = /SHORT|SAT-|Pusu\(S\)|↘/i.test(`${alarmStr} ${pusuStr} ${anaYonStr}`);
      const longYonMu  = /LONG|AL-|Pusu\(L\)|↗/i.test(`${alarmStr} ${pusuStr} ${anaYonStr}`);

      if (aPlusMu || onayliFormasyonMu) {
        const kisaRozet = aPlusMu ? "🔥 A+ BOS" : "🎯 PUSU";
        return {
          ustGrupMu: true,
          seviye: 1,
          rozetMetin: kisaRozet,
          rozetSinif: shortYonMu && !longYonMu ? "durum-asat" : "durum-aplus",
          cerceve: shortYonMu && !longYonMu ? "cerceve-short-sinyal" : "cerceve-pozitif"
        };
      }
      if (digerAlarmMi) {
        const kisaRozet = /EMİLİM/i.test(alarmStr) ? "🛡️ EMİLİM" : (/ALARM-2/i.test(alarmStr) || anaYonStr.includes("⚡") ? "⚡ BOS" : "🚨 ALARM");
        return {
          ustGrupMu: true,
          seviye: 2,
          rozetMetin: kisaRozet,
          rozetSinif: "durum-pusu",
          cerceve: "cerceve-uyari"
        };
      }
      if (pusuBekleyenMi) {
        return {
          ustGrupMu: true,
          seviye: 3,
          rozetMetin: pusuStr.includes("[Emilim]") ? "🛡️ EMİLİM" : "⏳ PUSU",
          rozetSinif: "durum-pusu",
          cerceve: "cerceve-uyari"
        };
      }
      return {
        ustGrupMu: false,
        seviye: 9,
        rozetMetin: "",
        rozetSinif: "",
        cerceve: "cerceve-notr"
      };
    }

    function tumHisseleriHazirla(veri) {
      let hamListe = Array.isArray(veri && veri.tumHisseler) ? veri.tumHisseler.slice() : [];
      const doGetGuncelMi = Array.isArray(veri && veri.tumHisseler);
      if (!doGetGuncelMi && Array.isArray(veri && veri.pozisyonlar)) {
        // doGet henüz v9'a güncellenmediyse eldeki pozisyon/RE hisselerini yedek olarak göster
        const gorulen = new Set();
        veri.pozisyonlar.forEach(p => {
          const ad = kisaAdTemizle(p.etiket);
          if (ad && ad !== "ONS" && ad !== "BİST 30" && !gorulen.has(ad)) {
            gorulen.add(ad);
            hamListe.push({
              kod: ad,
              etiket: p.etiket,
              fiyat: p.fiyat,
              vwapAlfa: p.vwapAlfa || "",
              ustYapi: p.ustYapi,
              anaYon: p.anaYon,
              guc: p.guc,
              icDalga: p.icDalga,
              pusu: p.pusu,
              destek: p.destek,
              direnc: p.direnc,
              nobetci: p.nobetci,
              zikzak15: p.zikzak15,
              zikzakBaslangicSn: p.zikzakBaslangicSn,
              zaman: p.zaman,
              pozDurum: reKaydiMi(p) ? "re" : "acik"
            });
          }
        });
      }

      const islenmis = hamListe.map(h => {
        const kod = kisaAdTemizle(h.kod || h.etiket || "");
        const sinifBilgi = hisseAlarmPusuSiniflandir(h);
        return { kod: kod, veri: h, sinifBilgi: sinifBilgi };
      }).filter(x => x.kod && x.kod !== "ONS" && x.kod !== "BİST 30");

      const alarmPusuGrubu = islenmis
        .filter(x => x.sinifBilgi.ustGrupMu)
        .sort((a, b) => (a.sinifBilgi.seviye - b.sinifBilgi.seviye) || a.kod.localeCompare(b.kod, "tr"));

      const alfabetikGrup = islenmis
        .filter(x => !x.sinifBilgi.ustGrupMu)
        .sort((a, b) => a.kod.localeCompare(b.kod, "tr"));

      return {
        toplam: islenmis.length,
        alarmPusuGrubu: alarmPusuGrubu,
        alfabetikGrup: alfabetikGrup,
        doGetGuncelMi: doGetGuncelMi
      };
    }

    function onsDolarFiyatAyikla(fiyatStr) {
      const m = String(fiyatStr || "").match(/^\s*([\d.,]+)/);
      if (!m) return "";
      let ham = m[1];
      if (ham.includes(".") && ham.includes(",")) {
        ham = ham.replace(/\./g, "").replace(",", ".");
      } else if (ham.includes(",")) {
        ham = ham.replace(",", ".");
      }
      const sayi = parseFloat(ham);
      if (isNaN(sayi) || sayi <= 0) return "";
      const tamSayi = Math.round(sayi);
      const binlik = String(tamSayi).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `$${binlik}`;
    }

    function kisaAdTemizle(etiket) {
      let s = String(etiket || "").split("[")[0].trim();
      if (/BİST30\s*V\.|BIST30\s*V\.|XU030D1!/i.test(s)) return "BİST 30";
      if (/BIST\s*30|BİST\s*30|XU030/i.test(s)) return "BİST 30";
      if (/Ons\s*Altın|ONS\s*ALTIN|^ONS$/i.test(s)) return "ONS";
      return s;
    }

    function icDalgaRenkSinifi(icDalgaStr) {
      const s = String(icDalgaStr || "");
      if (s.includes("Long") || s.includes("↗")) return "renk-yesil";
      if (s.includes("Short") || s.includes("↘")) return "renk-kirmizi";
      return "renk-gri";
    }

    function reKaydiMi(p) {
      const etiket = String(p.etiket || "");
      const nobetci = String(p.nobetci || "");
      return /\[(RE-SHORT|RE-LONG)/i.test(etiket) || /NÖBETÇİ\s*\(RE-/i.test(nobetci);
    }

    function kzAyikla(p) {
      const s = String(p.nobetci || "");
      const etiket = String(p.etiket || "");
      const isRe = reKaydiMi(p);

      if (!isRe) {
        const kzM = s.match(/\[K\/Z:([^\]]+)\]/);
        if (kzM) {
          const icerik = kzM[1].trim();
          const tlKisim = icerik.match(/^([+\-][\d.,]+\s*TL)/i);
          const gosterim = tlKisim ? tlKisim[1] : icerik;
          const renk = gosterim.includes("+") ? "renk-yesil" : gosterim.includes("-") ? "renk-kirmizi" : "renk-gri";
          return {
            isRe: false,
            html: `<div class="kz-dev ${renk}">${gosterim}</div>`,
            pozitifMi: gosterim.startsWith("+"),
            negatifMi: gosterim.startsWith("-")
          };
        }
        return { isRe: false, html: "", pozitifMi: false, negatifMi: false };
      }

      const isShortRe = /RE-SHORT/i.test(etiket) || /RE-SHORT/i.test(s);
      const fiyatStr = String(p.fiyat || "");
      const fM = fiyatStr.match(/^([\d.,]+)\s*\(%?([+\-]?\d+(?:[.,]\d+)?)\)/);
      const reM = etiket.match(/RE:([\d.]+)/i) || s.match(/RE:([\d.]+)/i);
      let reGunlukPct = null;
      let curPct = null;
      if (fM && reM) {
        const curPrice = parseFloat(fM[1].replace(",", "."));
        curPct = parseFloat(fM[2].replace(",", "."));
        const rePrice = parseFloat(reM[1]);
        if (curPrice > 0 && rePrice > 0 && !isNaN(curPct)) {
          const dunKapanis = curPrice / (1 + curPct / 100);
          reGunlukPct = ((rePrice - dunKapanis) / dunKapanis) * 100;
        }
      }

      let seviyeAsildi = false;
      if (reGunlukPct !== null && curPct !== null) {
        seviyeAsildi = isShortRe ? (curPct >= reGunlukPct - 0.05) : (curPct <= reGunlukPct + 0.05);
      } else if (s.includes("TEST EDİLDİ")) {
        seviyeAsildi = true;
      }

      const icStr = String(p.icDalga || "");
      const icUygun = isShortRe
        ? (icStr.includes("Short") || icStr.includes("↘"))
        : (icStr.includes("Long") || icStr.includes("↗"));

      const oranMetin = reGunlukPct !== null
        ? `(${reGunlukPct >= 0 ? "+" : ""}${reGunlukPct.toFixed(2)})`
        : "";
      const oranRenk = seviyeAsildi ? "renk-yesil" : "renk-gri";
      const uygunEk = (seviyeAsildi && icUygun) ? " - UYGUN" : "";

      return {
        isRe: true,
        html: `<div class="re-ust-satir"><span class="renk-sari">RE</span> <span class="${oranRenk}">${oranMetin}${uygunEk}</span></div>`,
        pozitifMi: (seviyeAsildi && icUygun),
        negatifMi: false
      };
    }

    function cerceveBelirle(nobetciStr, kzObj) {
      const s = String(nobetciStr || "");
      if (!kzObj.isRe && s.includes("🚨")) return "cerceve-kritik";
      if (!kzObj.isRe && s.includes("⚠️")) return "cerceve-uyari";
      if (kzObj.pozitifMi) return "cerceve-pozitif";
      if (kzObj.negatifMi) return "cerceve-uyari";
      return kzObj.isRe ? "kart-re" : "cerceve-notr";
    }

    function nobetciMetniSadelestir(nobetciStr) {
      let t = String(nobetciStr || "").replace(/\[(K\/Z|Fark):[^\]]+\]/g, "").trim();
      if (t.includes("|")) {
        const parcalar = t.split("|").map(x => x.trim());
        t = parcalar[parcalar.length - 1];
      }
      return t.replace(/NÖBETÇİ\s*\([^)]+\)\s*:\s*/i, "").trim();
    }

    function htmlGuvenliYap(metin) {
      return String(metin || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function bolumBasligiEkle(alan, metin, mod, hamZaman) {
      const ayirici = document.createElement("div");
      ayirici.className = mod === "ilk"
        ? "bolum-ayirici ilk-bolum"
        : mod === "cerceve-sonrasi"
          ? "bolum-ayirici cerceve-sonrasi"
          : "bolum-ayirici";

      const baslikSpan = document.createElement("span");
      baslikSpan.className = "bolum-baslik-metin";
      baslikSpan.textContent = metin;
      ayirici.appendChild(baslikSpan);

      if (hamZaman !== null && hamZaman !== undefined && hamZaman !== "") {
        const sure = gecenSureMetni(hamZaman);
        const zamanSpan = document.createElement("span");
        zamanSpan.className = "bolum-zaman-etiket";
        zamanSpan.setAttribute("data-zaman", String(hamZaman));
        zamanSpan.setAttribute("data-onek", "- ");
        zamanSpan.textContent = sure ? `- ${sure}` : "";
        ayirici.appendChild(zamanSpan);
      }

      alan.appendChild(ayirici);
    }

        // 1. BÖLÜM (EN ÜST): ANA PİYASA (SİMETRİK MAVİ ÇERÇEVE + SAĞ ÜST "TÜMÜ" BUTONU + ONS & BİST 30)

              <button type="button" class="tumu-ac-btn${btnEkSinif}" onclick="tumuCekmeceAc(event)" aria-label="Tüm BIST 30 Hisselerini Aç">Tümü</button>
            </div>
          `;
          anaCerceve.appendChild(anaBaslik);

          gostergeler.forEach((g, idx) => {

              ayirici.innerHTML = `<span class="ana-piyasa-elmas">◆</span>`;
              anaCerceve.appendChild(ayirici);
            }
            const ad = kisaAdTemizle(g.etiket);
            const isOns = (ad === "ONS");
            const kartIdx = ekranKartlari.push({ kategori: "ana", ad: ad, anahtar: "ana_" + ad, veri: g }) - 1;
            const rozetHtml = ucluRozetHtmlUret(g);
            const degisimHtml = gunlukDegisimHtmlUret(g.fiyat, kartIdx);
            const onsFiyatEk = isOns ? onsDolarFiyatAyikla(g.fiyat) : "";
            const icRenk = icDalgaRenkSinifi(g.icDalga);
            const pusuGoster = (g.pusu && g.pusu !== "Nötr" && g.pusu !== "-")
              ? `<div class="alt-bilgi-satir">${htmlGuvenliYap(g.pusu)}</div>`
              : "";

            const kartHamZaman = g.zaman || g.sonGuncelleme || (isOns ? veri.onsZaman : (veri.viopZaman || veri.bistZaman)) || veri.zaman || "";
            const kartSureMetin = gecenSureMetni(kartHamZaman);
            const kartZamanHtml = kartHamZaman
              ? `<span class="kart-zaman-etiket" data-zaman="${htmlGuvenliYap(kartHamZaman)}" data-onek="">${kartSureMetin}</span>`
              : "";

            const satir = document.createElement("div");
            satir.className = "ana-piyasa-satir";
            satir.innerHTML = `

        // 3. BÖLÜM: YENİDEN GİRİŞ (RE) NÖBETLERİ
