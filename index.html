<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f1f5f9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Canlı Nöbet Tabelası</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 9px 10px 78px 10px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Bölüm Ayırıcı Etiketler */
    .bolum-ayirici {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 800;
      color: #334155;
      letter-spacing: 0.5px;
      margin: 12px 2px 6px 2px;
      padding-top: 8px;
      border-top: 1.5px solid #cbd5e1;
    }
    .bolum-ayirici.ilk-bolum {
      margin-top: 2px;
      padding-top: 0;
      border-top: none;
    }
    .bolum-baslik-metin {
      text-transform: uppercase;
    }
    .bolum-zaman-etiket {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.1px;
      text-transform: none;
    }

    .nakit-serit {
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 7px 11px;
      margin-bottom: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: #64748b;
    }

    /* Kartlar */
    .kart {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-left-width: 5px;
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    .kart-sabit {
      background: #f8fafc;
      border-color: #cbd5e1;
      border-left: 5px solid #0284c7;
      padding: 8px 12px;
      margin-bottom: 7px;
    }
    .kart-re {
      background: #eef2ff;
      border-color: #c7d2fe;
      border-left: 5px solid #6366f1;
    }

    .cerceve-notr    { border-color: #cbd5e1; border-left-color: #64748b; }
    .cerceve-pozitif { border-color: #86efac; border-left-color: #16a34a; background: #f0fdf4; }
    .cerceve-uyari   { border-color: #fcd34d; border-left-color: #d97706; background: #fffbeb; }
    .cerceve-kritik  {
      border-color: #fca5a5;
      border-left-color: #dc2626;
      background: #fef2f2;
      animation: nabiz 1.6s infinite;
    }
    @keyframes nabiz {
      0%, 100% { box-shadow: 0 1px 3px rgba(220, 38, 38, 0.12); }
      50% { box-shadow: 0 0 14px rgba(220, 38, 38, 0.45); }
    }

    .ust-satir {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sembol-grup {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .sembol-baslik {
      font-size: 18.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: #0f172a;
    }
    .kart-sabit .sembol-baslik {
      font-size: 17.5px;
      color: #0f172a;
    }
    .ons-fiyat-metin {
      font-size: 16.5px;
      font-weight: 900;
      color: #0369a1;
    }
    .kart-zaman-etiket {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
      margin-left: auto;
    }

    /* 3'lü Kompakt Yön Rozetleri: [K] [15dk] [U] */
    .yon-rozet-grup {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .yon-rozet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.1px;
      white-space: nowrap;
    }
    .rozet-yesil {
      color: #16a34a;
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(22, 163, 74, 0.32);
    }
    .rozet-kirmizi {
      color: #dc2626;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.32);
    }
    .rozet-gri {
      color: #6b7280;
      background-color: rgba(156, 163, 175, 0.15);
      border: 1px solid rgba(107, 114, 128, 0.28);
    }
    body.koyu-tema .rozet-yesil, [data-theme="dark"] .rozet-yesil { color: #4ade80; }
    body.koyu-tema .rozet-kirmizi, [data-theme="dark"] .rozet-kirmizi { color: #f87171; }
    body.koyu-tema .rozet-gri, [data-theme="dark"] .rozet-gri { color: #9ca3af; }

    /* Günlük Değişim Alt Satırı */
    .gunluk-degisim-satir {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.25;
    }
    .kart-sabit .gunluk-degisim-satir {
      font-size: 13.5px;
    }
    .gunluk-degisim-etiket {
      color: #475569;
      font-weight: 700;
    }
    .gunluk-degisim-oran {
      font-weight: 800;
    }

    .kz-dev {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    .re-ust-satir {
      font-size: 17.5px;
      font-weight: 900;
      letter-spacing: 0.2px;
      margin-bottom: 3px;
    }
    .re-sembol-satir {
      margin-top: 1px;
    }

    /* Keskin Renk Sınıfları */
    .renk-yesil   { color: #15803d; }
    .renk-kirmizi { color: #dc2626; }
    .renk-sari    { color: #b45309; }
    .renk-gri     { color: #475569; }
    .renk-mavi    { color: #0369a1; }

    .ic-dalga-satir {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.25;
    }
    .kart-sabit .ic-dalga-satir {
      margin-top: 3px;
      font-size: 14.5px;
    }
    .alt-bilgi-satir {
      margin-top: 4px;
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
      line-height: 1.3;
    }

    /* ======================================================================
       ALTTAN YUKARI KAYDIRMALI HABER ÖZETİ ÇEKMECESİ
       ====================================================================== */
    .ozet-alt-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: #ffffff;
      border-top: 2px solid #0284c7;
      border-radius: 16px 16px 0 0;
      padding: 7px 15px calc(9px + env(safe-area-inset-bottom, 0px)) 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      touch-action: none;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.12);
    }
    .cekmece-tutamac {
      width: 44px;
      height: 4.5px;
      border-radius: 999px;
      background: #94a3b8;
    }
    .ozet-alt-satir {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }
    .ozet-alt-ipucu {
      font-size: 13px;
      font-weight: 800;
      color: #0284c7;
    }

    .ozet-arka-perde {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(15, 23, 42, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .ozet-arka-perde.acik {
      opacity: 1;
      pointer-events: auto;
    }
    .ozet-cekmece {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      height: 89vh;
      max-height: 89vh;
      background: #f1f5f9;
      border-top: 3px solid #0284c7;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      transform: translateY(104%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.25);
    }
    .ozet-cekmece.acik {
      transform: translateY(0);
    }
    .ozet-cekmece-ust {
      padding: 9px 12px 10px 12px;
      border-bottom: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 18px 18px 0 0;
      touch-action: none;
    }
    .ozet-cekmece-ust-cubuk {
      display: flex;
      justify-content: center;
      margin-bottom: 7px;
    }
    .ozet-baslik-satir {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .ozet-ana-baslik {
      font-size: 16.5px;
      font-weight: 900;
      color: #0f172a;
      white-space: nowrap;
    }
    .ozet-buton-grup {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-shrink: 0;
    }
    .ozet-btn {
      background: #f0f9ff;
      color: #0369a1;
      border: 1px solid #7dd3fc;
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1.1;
    }
    .ozet-btn-boyut {
      min-width: 44px;
      text-align: center;
      letter-spacing: -0.2px;
    }
    .ozet-btn-boyut.buyutuldu {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #075985;
    }
    .ozet-btn-kapat {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #b91c1c;
    }

    /* Çekmece Gövdesi ve 3 Kademeli Yazı Boyutu Sınıfları */
    .ozet-icerik-alani {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 13px 13px calc(22px + env(safe-area-inset-bottom, 0px)) 13px;
      user-select: text;
      font-weight: 500;
      color: #1e293b;
    }
    .ozet-icerik-alani.boyut-normal {
      font-size: 17px;
      line-height: 1.56;
    }
    .ozet-icerik-alani.boyut-buyuk {
      font-size: 19.5px;
      line-height: 1.62;
    }
    .ozet-icerik-alani.boyut-cok-buyuk {
      font-size: 22px;
      line-height: 1.65;
    }

    /* Bölüm Başlıkları ve Madde Kartları */
    .ozet-bolum-baslik {
      font-size: 1.02em;
      font-weight: 900;
      color: #075985;
      background: #e0f2fe;
      border-left: 4px solid #0284c7;
      padding: 7px 11px;
      border-radius: 6px;
      margin: 12px 0 10px 0;
      letter-spacing: 0.3px;
    }
    .ozet-bolum-baslik:first-child {
      margin-top: 0;
    }
    .ozet-bolum-baslik-esnek {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-right: 1ch;
    }
    .ozet-strateji-sure {
      font-size: 0.76em;
      font-weight: 700;
      color: #0369a1;
      white-space: nowrap;
      letter-spacing: 0;
      margin-left: auto;
    }

    .ozet-madde {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      padding: 11px 13px;
      margin-bottom: 10px;
      color: #1e293b;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .ozet-madde-vurgu {
      color: #0369a1;
      font-weight: 800;
    }
    .ozet-paragraf {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      color: #1e293b;
    }
    .ozet-bilgi-mesaj {
      text-align: center;
      padding: 28px 12px;
      font-size: 15.5px;
      font-weight: 700;
      color: #475569;
    }
  </style>
</head>
<body>
  <div id="icerikAlani">
    <div class="nakit-serit">⏳ Veriler yükleniyor...</div>
  </div>

  <!-- SABİT ALT TUTAMAÇ BARI -->
  <div id="ozetAltBar" class="ozet-alt-bar" onclick="altBarTiklandi(event)">
    <div class="cekmece-tutamac"></div>
    <div class="ozet-alt-satir">
      <span id="ozetAltEtiket">📄 Haber Özeti</span>
      <span class="ozet-alt-ipucu">⌃ Yukarı Kaydır</span>
    </div>
  </div>

  <!-- KARARTMA PERDESİ VE HABER ÖZETİ OKUMA ÇEKMECESİ -->
  <div id="ozetPerde" class="ozet-arka-perde" onclick="ozetCekmeceKapat(event)"></div>
  <div id="ozetCekmece" class="ozet-cekmece" onclick="event.stopPropagation()">
    <div id="ozetCekmeceUst" class="ozet-cekmece-ust">
      <div class="ozet-cekmece-ust-cubuk">
        <div class="cekmece-tutamac"></div>
      </div>
      <div class="ozet-baslik-satir">
        <div id="cekmeceAnaBaslik" class="ozet-ana-baslik">📰 Haber Özeti</div>
        <div class="ozet-buton-grup">
          <button id="ozetBoyutBtn" class="ozet-btn ozet-btn-boyut" onclick="ozetYaziBoyutuDegistir(event)">Aa</button>
          <button class="ozet-btn ozet-btn-kapat" onclick="ozetCekmeceKapat(event)">✕ Kapat</button>
        </div>
      </div>
    </div>
    <div id="ozetGovde" class="ozet-icerik-alani boyut-normal">
      <div class="ozet-bilgi-mesaj">⏳ Veriler yükleniyor...</div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyMit9WOCaCUglLFosrQmg2cbo7iQ-lKwqCltJKqaikFvpIVfnXBXXlIGeL7Yrc_GIR/exec";
    const YENILEME_SANIYE = 120;

    const YAZI_KADEMELERI = [
      { sinif: "boyut-normal",    etiket: "Aa" },
      { sinif: "boyut-buyuk",     etiket: "Aa+" },
      { sinif: "boyut-cok-buyuk", etiket: "Aa++" }
    ];

    let sonOzetCekimMs = 0;
    let ozetYukleniyor = false;
    let aktifYaziKademe = 0;
    let sonCekilenPaket = null;

    function yaziBoyutunuUygula(kademe) {
      const gecerli = (kademe >= 0 && kademe < YAZI_KADEMELERI.length) ? kademe : 0;
      aktifYaziKademe = gecerli;
      const govdeEl = document.getElementById("ozetGovde");
      const btnEl = document.getElementById("ozetBoyutBtn");
      YAZI_KADEMELERI.forEach(k => govdeEl.classList.remove(k.sinif));
      govdeEl.classList.add(YAZI_KADEMELERI[gecerli].sinif);
      btnEl.textContent = YAZI_KADEMELERI[gecerli].etiket;
      if (gecerli > 0) btnEl.classList.add("buyutuldu");
      else btnEl.classList.remove("buyutuldu");
    }

    function ozetYaziBoyutuDegistir(ev) {
      if (ev) ev.stopPropagation();
      const yeniKademe = (aktifYaziKademe + 1) % YAZI_KADEMELERI.length;
      yaziBoyutunuUygula(yeniKademe);
      try {
        localStorage.setItem("OZET_YAZI_KADEME", String(yeniKademe));
      } catch (_) {}
    }

    (function kayitliYaziBoyutunuYukle() {
      try {
        const kayitli = parseInt(localStorage.getItem("OZET_YAZI_KADEME") || "0", 10);
        if (!isNaN(kayitli)) yaziBoyutunuUygula(kayitli);
      } catch (_) {}
    })();

    // =========================================================================
    // ZAMAN AYRIŞTIRICI VE "50 sn önce / 2 dk önce / 1 saat önce" HESAPLAYICI
    // =========================================================================
    function zamanMsCoz(hamZaman) {
      if (hamZaman === null || hamZaman === undefined || hamZaman === "") return null;
      if (typeof hamZaman === "number" && !isNaN(hamZaman)) {
        return hamZaman > 1e11 ? hamZaman : hamZaman * 1000;
      }
      const s = String(hamZaman).trim();
      if (!s || s === "-") return null;

      if (/^\d{9,13}$/.test(s)) {
        const n = Number(s);
        return n > 1e11 ? n : n * 1000;
      }

      // Format 1: "23.11.2026 17:58" veya "23.11.2026 17:58:10"
      const mTr = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (mTr) {
        const gun = mTr[1].padStart(2, "0");
        const ay  = mTr[2].padStart(2, "0");
        const yil = mTr[3];
        const sa  = mTr[4].padStart(2, "0");
        const dk  = mTr[5].padStart(2, "0");
        const sn  = (mTr[6] || "00").padStart(2, "0");
        const ms = Date.parse(`${yil}-${ay}-${gun}T${sa}:${dk}:${sn}+03:00`);
        if (!isNaN(ms)) return ms;
      }

      // Format 2: "2026-11-23 17:58:10"
      const mIso = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (mIso) {
        const yil = mIso[1];
        const ay  = mIso[2].padStart(2, "0");
        const gun = mIso[3].padStart(2, "0");
        const sa  = mIso[4].padStart(2, "0");
        const dk  = mIso[5].padStart(2, "0");
        const sn  = (mIso[6] || "00").padStart(2, "0");
        const ms = Date.parse(`${yil}-${ay}-${gun}T${sa}:${dk}:${sn}+03:00`);
        if (!isNaN(ms)) return ms;
      }

      // Format 3: Sadece "22:20" veya "22:20:15"
      const mSaat = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (mSaat) {
        const simdi = new Date();
        const aday = new Date(
          simdi.getFullYear(),
          simdi.getMonth(),
          simdi.getDate(),
          Number(mSaat[1]),
          Number(mSaat[2]),
          Number(mSaat[3] || 0)
        );
        if (aday.getTime() - simdi.getTime() > 5 * 60 * 1000) {
          aday.setDate(aday.getDate() - 1);
        }
        return aday.getTime();
      }

      const dogrudan = Date.parse(s);
      return isNaN(dogrudan) ? null : dogrudan;
    }

    function gecenSureMetni(hamZaman) {
      const hedefMs = zamanMsCoz(hamZaman);
      if (!hedefMs) return "";
      const farkSn = Math.max(0, Math.floor((Date.now() - hedefMs) / 1000));
      if (farkSn < 5) return "Az önce";
      if (farkSn < 60) return `${farkSn} sn önce`;
      const farkDk = Math.floor(farkSn / 60);
      if (farkDk < 60) return `${farkDk} dk önce`;
      const farkSaat = Math.floor(farkDk / 60);
      if (farkSaat < 24) return `${farkSaat} saat önce`;
      const farkGun = Math.floor(farkSaat / 24);
      return `${farkGun} gün önce`;
    }

    function canliSureEtiketleriniGuncelle() {
      document.querySelectorAll("[data-zaman]").forEach(el => {
        const ham = el.getAttribute("data-zaman") || "";
        const onEk = el.getAttribute("data-onek") || "";
        const metin = gecenSureMetni(ham);
        el.textContent = metin ? `${onEk}${metin}` : "";
      });
      altBarEtiketiniGuncelle();
    }

    function altBarEtiketiniGuncelle() {
      const altEtiketEl = document.getElementById("ozetAltEtiket");
      if (!altEtiketEl) return;
      if (sonCekilenPaket && sonCekilenPaket.zaman) {
        const sure = gecenSureMetni(sonCekilenPaket.zaman);
        altEtiketEl.textContent = sure ? `📄 Haber Özeti (${sure})` : "📄 Haber Özeti";
      } else {
        altEtiketEl.textContent = "📄 Haber Özeti";
      }
    }

    // =========================================================================
    // ROZET ([K] [15dk] [U]) VE KART BİÇİMLENDİRME YARDIMCILARI
    // =========================================================================
    function ucluEmojiDizisiniCoz(dizgi) {
      if (!dizgi) return null;
      const semboller = Array.from(String(dizgi)).filter(ch =>
        ch === "🟢" || ch === "🔴" || ch === "🔘" || ch === "⚪"
      );
      if (semboller.length < 3) return null;
      const renkCevir = (s) => s === "🟢" ? "rozet-yesil" : s === "🔴" ? "rozet-kirmizi" : "rozet-gri";
      return [renkCevir(semboller[0]), renkCevir(semboller[1]), renkCevir(semboller[2])];
    }

    function ucluRozetHtmlUret(kayit) {
      const ucluYedek = ucluEmojiDizisiniCoz(kayit.ucSimge || kayit.yonSimgeleri || "");

      // 1) [K] - Kısa / İç Dalga (8. sütun)
      const icMetin = String(kayit.icDalga || "");
      let renkK = "rozet-gri";
      if (icMetin) {
        if (/Long/i.test(icMetin) || icMetin.includes("↗")) renkK = "rozet-yesil";
        else if (/Short/i.test(icMetin) || icMetin.includes("↘")) renkK = "rozet-kirmizi";
      } else if (ucluYedek) {
        renkK = ucluYedek[0];
      }

      // 2) [15dk] - Orta / 15dk Ana SMC Yönü (5. sütun)
      const anaMetin = String(kayit.anaYon || "");
      let renk15 = "rozet-gri";
      if (anaMetin) {
        if (anaMetin.includes("🟢") || /LONG/i.test(anaMetin)) renk15 = "rozet-yesil";
        else if (anaMetin.includes("🔴") || /SHORT/i.test(anaMetin)) renk15 = "rozet-kirmizi";
      } else if (ucluYedek) {
        renk15 = ucluYedek[1];
      }

      // 3) [U] - Uzun / 60dk Üst Yapı (4. sütun)
      const ustMetin = String(kayit.ustYapi || kayit.tf2Ozet || kayit.ustYon || "");
      let renkU = "rozet-gri";
      if (ustMetin) {
        if (ustMetin.includes("🟢") || /L-BOS|L-CHOCH/i.test(ustMetin)) renkU = "rozet-yesil";
        else if (ustMetin.includes("🔴") || /S-BOS|S-CHOCH/i.test(ustMetin)) renkU = "rozet-kirmizi";
      } else if (ucluYedek) {
        renkU = ucluYedek[2];
      }

      return `
        <span class="yon-rozet-grup">
          <span class="yon-rozet ${renkK}">K</span>
          <span class="yon-rozet ${renk15}">15dk</span>
          <span class="yon-rozet ${renkU}">U</span>
        </span>
      `;
    }

    function gunlukDegisimHtmlUret(fiyatStr) {
      const m = String(fiyatStr || "").match(/\(%?([+\-]?\d+(?:[.,]\d+)?)\)/);
      if (!m) {
        return `<div class="gunluk-degisim-satir"><span class="gunluk-degisim-etiket">Günlük Değişim:</span> <span class="gunluk-degisim-oran renk-gri">-</span></div>`;
      }
      const oran = m[1];
      const renk = oran.includes("+") ? "renk-yesil" : oran.includes("-") ? "renk-kirmizi" : "renk-gri";
      return `<div class="gunluk-degisim-satir"><span class="gunluk-degisim-etiket">Günlük Değişim:</span> <span class="gunluk-degisim-oran ${renk}">% ${htmlGuvenliYap(oran)}</span></div>`;
    }

    function onsDolarFiyatAyikla(fiyatStr) {
      const m = String(fiyatStr || "").match(/^\s*([\d.,]+)/);
      if (!m) return "";
      let ham = m[1];
      if (ham.includes(".") && ham.includes(",")) {
        ham = ham.replace(/\./g, "").replace(",", ".");
      } else if (ham.includes(",")) {
        ham = ham.replace(",", ".");
      }
      const sayi = parseFloat(ham);
      if (isNaN(sayi) || sayi <= 0) return "";
      const tamSayi = Math.round(sayi);
      const binlik = String(tamSayi).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return `$${binlik}`;
    }

    function kisaAdTemizle(etiket) {
      let s = String(etiket || "").split("[")[0].trim();
      if (/BİST30\s*V\.|XU030D1!/i.test(s)) return "BİST30 V.";
      if (/BIST\s*30/i.test(s)) return "BİST30 V.";
      if (/Ons\s*Altın|ONS\s*ALTIN|^ONS$/i.test(s)) return "ONS";
      return s;
    }

    function icDalgaRenkSinifi(icDalgaStr) {
      const s = String(icDalgaStr || "");
      if (s.includes("Long") || s.includes("↗")) return "renk-yesil";
      if (s.includes("Short") || s.includes("↘")) return "renk-kirmizi";
      return "renk-gri";
    }

    function reKaydiMi(p) {
      const etiket = String(p.etiket || "");
      const nobetci = String(p.nobetci || "");
      return /\[(RE-SHORT|RE-LONG)/i.test(etiket) || /NÖBETÇİ\s*\(RE-/i.test(nobetci);
    }

    function kzAyikla(p) {
      const s = String(p.nobetci || "");
      const etiket = String(p.etiket || "");
      const isRe = reKaydiMi(p);

      if (!isRe) {
        const kzM = s.match(/\[K\/Z:([^\]]+)\]/);
        if (kzM) {
          const icerik = kzM[1].trim();
          const tlKisim = icerik.match(/^([+\-][\d.,]+\s*TL)/i);
          const gosterim = tlKisim ? tlKisim[1] : icerik;
          const renk = gosterim.includes("+") ? "renk-yesil" : gosterim.includes("-") ? "renk-kirmizi" : "renk-gri";
          return {
            isRe: false,
            html: `<div class="kz-dev ${renk}">${gosterim}</div>`,
            pozitifMi: gosterim.startsWith("+"),
            negatifMi: gosterim.startsWith("-")
          };
        }
        return { isRe: false, html: "", pozitifMi: false, negatifMi: false };
      }

      const isShortRe = /RE-SHORT/i.test(etiket) || /RE-SHORT/i.test(s);
      const fiyatStr = String(p.fiyat || "");
      const fM = fiyatStr.match(/^([\d.,]+)\s*\(%?([+\-]?\d+(?:[.,]\d+)?)\)/);
      const reM = etiket.match(/RE:([\d.]+)/i) || s.match(/RE:([\d.]+)/i);
      let reGunlukPct = null;
      let curPct = null;
      if (fM && reM) {
        const curPrice = parseFloat(fM[1].replace(",", "."));
        curPct = parseFloat(fM[2].replace(",", "."));
        const rePrice = parseFloat(reM[1]);
        if (curPrice > 0 && rePrice > 0 && !isNaN(curPct)) {
          const dunKapanis = curPrice / (1 + curPct / 100);
          reGunlukPct = ((rePrice - dunKapanis) / dunKapanis) * 100;
        }
      }

      let seviyeAsildi = false;
      if (reGunlukPct !== null && curPct !== null) {
        seviyeAsildi = isShortRe ? (curPct >= reGunlukPct - 0.05) : (curPct <= reGunlukPct + 0.05);
      } else if (s.includes("TEST EDİLDİ")) {
        seviyeAsildi = true;
      }

      const icStr = String(p.icDalga || "");
      const icUygun = isShortRe
        ? (icStr.includes("Short") || icStr.includes("↘"))
        : (icStr.includes("Long") || icStr.includes("↗"));

      const oranMetin = reGunlukPct !== null
        ? `(${reGunlukPct >= 0 ? "+" : ""}${reGunlukPct.toFixed(2)})`
        : "";
      const oranRenk = seviyeAsildi ? "renk-yesil" : "renk-gri";
      const uygunEk = (seviyeAsildi && icUygun) ? " - UYGUN" : "";

      return {
        isRe: true,
        html: `<div class="re-ust-satir"><span class="renk-sari">RE</span> <span class="${oranRenk}">${oranMetin}${uygunEk}</span></div>`,
        pozitifMi: (seviyeAsildi && icUygun),
        negatifMi: false
      };
    }

    function cerceveBelirle(nobetciStr, kzObj) {
      const s = String(nobetciStr || "");
      if (!kzObj.isRe && s.includes("🚨")) return "cerceve-kritik";
      if (!kzObj.isRe && s.includes("⚠️")) return "cerceve-uyari";
      if (kzObj.pozitifMi) return "cerceve-pozitif";
      if (kzObj.negatifMi) return "cerceve-uyari";
      return kzObj.isRe ? "kart-re" : "cerceve-notr";
    }

    function nobetciMetniSadelestir(nobetciStr) {
      let t = String(nobetciStr || "").replace(/\[(K\/Z|Fark):[^\]]+\]/g, "").trim();
      if (t.includes("|")) {
        const parcalar = t.split("|").map(x => x.trim());
        t = parcalar[parcalar.length - 1];
      }
      return t.replace(/NÖBETÇİ\s*\([^)]+\)\s*:\s*/i, "").trim();
    }

    function htmlGuvenliYap(metin) {
      return String(metin || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function bolumBasligiEkle(alan, metin, ilkMi, hamZaman) {
      const ayirici = document.createElement("div");
      ayirici.className = ilkMi ? "bolum-ayirici ilk-bolum" : "bolum-ayirici";

      const baslikSpan = document.createElement("span");
      baslikSpan.className = "bolum-baslik-metin";
      baslikSpan.textContent = metin;
      ayirici.appendChild(baslikSpan);

      if (hamZaman !== null && hamZaman !== undefined && hamZaman !== "") {
        const sure = gecenSureMetni(hamZaman);
        const zamanSpan = document.createElement("span");
        zamanSpan.className = "bolum-zaman-etiket";
        zamanSpan.setAttribute("data-zaman", String(hamZaman));
        zamanSpan.setAttribute("data-onek", "- ");
        zamanSpan.textContent = sure ? `- ${sure}` : "";
        ayirici.appendChild(zamanSpan);
      }

      alan.appendChild(ayirici);
    }

    async function veriyiCek() {
      try {
        const res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
        const veri = await res.json();
        if (!veri.ok) throw new Error(veri.hata || "Veri hatası");

        const alan = document.getElementById("icerikAlani");
        alan.innerHTML = "";

        const tumPozlar = veri.pozisyonlar || [];
        const acikPozlar = tumPozlar.filter(p => !reKaydiMi(p));
        const reNobetleri = tumPozlar.filter(p => reKaydiMi(p));

        const ilkAcikZaman = acikPozlar.find(p => p.zaman || p.sonGuncelleme);
        const acikGrupZaman = veri.acikPozZaman || veri.hisseZaman || (ilkAcikZaman && (ilkAcikZaman.zaman || ilkAcikZaman.sonGuncelleme)) || veri.zaman || "";

        // 1. BÖLÜM: GERÇEK AÇIK POZİSYONLAR
        bolumBasligiEkle(alan, "💼 Açık Pozisyonlar", true, acikGrupZaman);
        if (acikPozlar.length > 0) {
          acikPozlar.forEach(p => {
            const ad = kisaAdTemizle(p.etiket);
            const rozetHtml = ucluRozetHtmlUret(p);
            const degisimHtml = gunlukDegisimHtmlUret(p.fiyat);
            const icRenk = icDalgaRenkSinifi(p.icDalga);
            const kzObj = kzAyikla(p);
            const cerceve = cerceveBelirle(p.nobetci, kzObj);
            const temizNobetci = nobetciMetniSadelestir(p.nobetci);
            const nobetciStr = String(p.nobetci || "");
            const nobetciRenk = nobetciStr.includes("🚨") ? "renk-kirmizi"
                              : nobetciStr.includes("⚠️") ? "renk-sari"
                              : nobetciStr.includes("✅") ? "renk-yesil" : "renk-gri";

            const kart = document.createElement("div");
            kart.className = `kart ${cerceve}`;
            kart.innerHTML = `
              <div class="ust-satir">
                <div class="sembol-grup">
                  <span class="sembol-baslik">${htmlGuvenliYap(ad)}</span>
                  ${rozetHtml}
                </div>
                ${kzObj.html}
              </div>
              ${degisimHtml}
              <div class="ic-dalga-satir ${icRenk}">${htmlGuvenliYap(p.icDalga || "-")}</div>
              <div class="alt-bilgi-satir ${nobetciRenk}">${htmlGuvenliYap(temizNobetci || p.pusu || "")}</div>
            `;
            alan.appendChild(kart);
          });
        } else {
          const nakit = document.createElement("div");
          nakit.className = "nakit-serit";
          nakit.textContent = "⚪ Açık pozisyon bulunmuyor (%100 Nakit)";
          alan.appendChild(nakit);
        }

        // 2. BÖLÜM: ANA PİYASA (ÖNCE ONS, SONRA BİST30 V. — HER KARTIN KENDİ ZAMANI AYRI)
        const gostergeler = [...(veri.anaGostergeler || [])].sort((a, b) => {
          const aOns = /ONS/i.test(a.etiket) ? 0 : 1;
          const bOns = /ONS/i.test(b.etiket) ? 0 : 1;
          return aOns - bOns;
        });

        if (gostergeler.length > 0) {
          bolumBasligiEkle(alan, "🌐 Ana Piyasa", false, null);
          gostergeler.forEach(g => {
            const ad = kisaAdTemizle(g.etiket);
            const isOns = (ad === "ONS");
            const rozetHtml = ucluRozetHtmlUret(g);
            const degisimHtml = gunlukDegisimHtmlUret(g.fiyat);
            const onsFiyatEk = isOns ? onsDolarFiyatAyikla(g.fiyat) : "";
            const icRenk = icDalgaRenkSinifi(g.icDalga);
            const pusuGoster = (g.pusu && g.pusu !== "Nötr" && g.pusu !== "-")
              ? `<div class="alt-bilgi-satir">${htmlGuvenliYap(g.pusu)}</div>`
              : "";

            const kartHamZaman = g.zaman || g.sonGuncelleme || (isOns ? veri.onsZaman : (veri.viopZaman || veri.bistZaman)) || veri.zaman || "";
            const kartSureMetin = gecenSureMetni(kartHamZaman);
            const kartZamanHtml = kartHamZaman
              ? `<span class="kart-zaman-etiket" data-zaman="${htmlGuvenliYap(kartHamZaman)}" data-onek="">${kartSureMetin}</span>`
              : "";

            const sabitKart = document.createElement("div");
            sabitKart.className = "kart kart-sabit";
            sabitKart.innerHTML = `
              <div class="ust-satir">
                <div class="sembol-grup">
                  <span class="sembol-baslik">${htmlGuvenliYap(ad)}</span>
                  ${onsFiyatEk ? `<span class="ons-fiyat-metin">${onsFiyatEk}</span>` : ""}
                  ${rozetHtml}
                </div>
                ${kartZamanHtml}
              </div>
              ${degisimHtml}
              <div class="ic-dalga-satir ${icRenk}">${htmlGuvenliYap(g.icDalga || "-")}</div>
              ${pusuGoster}
            `;
            alan.appendChild(sabitKart);
          });
        }

        // 3. BÖLÜM: YENİDEN GİRİŞ (RE) NÖBETLERİ
        if (reNobetleri.length > 0) {
          const ilkReZaman = reNobetleri.find(p => p.zaman || p.sonGuncelleme);
          const reGrupZaman = veri.reZaman || veri.hisseZaman || (ilkReZaman && (ilkReZaman.zaman || ilkReZaman.sonGuncelleme)) || veri.zaman || "";
          bolumBasligiEkle(alan, "📌 Yeniden Giriş (RE) Nöbeti", false, reGrupZaman);

          reNobetleri.forEach(p => {
            const ad = kisaAdTemizle(p.etiket);
            const rozetHtml = ucluRozetHtmlUret(p);
            const degisimHtml = gunlukDegisimHtmlUret(p.fiyat);
            const icRenk = icDalgaRenkSinifi(p.icDalga);
            const kzObj = kzAyikla(p);
            const cerceve = cerceveBelirle(p.nobetci, kzObj);
            const pusuSatir = (p.pusu && p.pusu !== "Nötr" && p.pusu !== "-")
              ? `<div class="alt-bilgi-satir">${htmlGuvenliYap(p.pusu)}</div>`
              : "";

            const kart = document.createElement("div");
            kart.className = `kart ${cerceve}`;
            kart.innerHTML = `
              ${kzObj.html}
              <div class="re-sembol-satir sembol-grup">
                <span class="sembol-baslik">${htmlGuvenliYap(ad)}</span>
                ${rozetHtml}
              </div>
              ${degisimHtml}
              <div class="ic-dalga-satir ${icRenk}">${htmlGuvenliYap(p.icDalga || "-")}</div>
              ${pusuSatir}
            `;
            alan.appendChild(kart);
          });
        }
      } catch (err) {
        const alan = document.getElementById("icerikAlani");
        if (alan && !alan.querySelector(".kart")) {
          alan.innerHTML = `<div class="nakit-serit">⚠️ Bağlantı bekleniyor...</div>`;
        }
      }
    }

    // =========================================================================
    // HABER ÖZETİ / ÖZET STRATEJİ ÇEKMECESİ (BİST 30 & ONS SEKMELERİ KALDIRILDI)
    // =========================================================================
    function ozetMetniniBicimlendir(hamMetin, ozetHamZaman) {
      if (!hamMetin) return `<div class="ozet-bilgi-mesaj">Özet metni bulunamadı.</div>`;
      const satirlar = String(hamMetin).split("\n");
      const hamBaslikIndeksleri = [];
      const temizSatirlar = [];

      for (const hamSatir of satirlar) {
        const s = hamSatir.trim();
        if (!s) continue;
        const yildizsiz = s.replace(/\*/g, "").trim();
        const buyukBaslikMi = (/^[A-ZÇĞİÖŞÜ0-9\s/()\-]{4,55}:?$/.test(yildizsiz) && !yildizsiz.startsWith("-"));
        const temizMetin = buyukBaslikMi ? yildizsiz : s;
        if (buyukBaslikMi) hamBaslikIndeksleri.push(temizSatirlar.length);
        temizSatirlar.push({ metin: temizMetin, baslikMi: buyukBaslikMi });
      }

      // Öncelikle "ÖZET STRATEJİ" satırını, yoksa ilk büyük bölüm başlığını bul
      let hedefSureSatirIdx = -1;
      for (const idx of hamBaslikIndeksleri) {
        if (/ÖZET\s*STRATEJ/i.test(temizSatirlar[idx].metin)) {
          hedefSureSatirIdx = idx;
          break;
        }
      }
      if (hedefSureSatirIdx === -1 && hamBaslikIndeksleri.length > 0) {
        hedefSureSatirIdx = hamBaslikIndeksleri[0];
      }

      const sureMetin = ozetHamZaman ? gecenSureMetni(ozetHamZaman) : "";
      let html = "";

      // Eğer metinde hiç büyük başlık yoksa en üste ÖZET STRATEJİ şeridi koy
      if (hedefSureSatirIdx === -1 && ozetHamZaman) {
        html += `
          <div class="ozet-bolum-baslik ozet-bolum-baslik-esnek">
            <span>ÖZET STRATEJİ</span>
            <span class="ozet-strateji-sure" data-zaman="${htmlGuvenliYap(ozetHamZaman)}" data-onek="">${sureMetin}</span>
          </div>
        `;
      }

      for (let i = 0; i < temizSatirlar.length; i++) {
        const s = temizSatirlar[i].metin;
        if (temizSatirlar[i].baslikMi) {
          const baslikTemiz = htmlGuvenliYap(s.replace(/:$/, ""));
          if (i === hedefSureSatirIdx && ozetHamZaman) {
            html += `
              <div class="ozet-bolum-baslik ozet-bolum-baslik-esnek">
                <span>${baslikTemiz}</span>
                <span class="ozet-strateji-sure" data-zaman="${htmlGuvenliYap(ozetHamZaman)}" data-onek="">${sureMetin}</span>
              </div>
            `;
          } else {
            html += `<div class="ozet-bolum-baslik">${baslikTemiz}</div>`;
          }
          continue;
        }

        if (/^[\-•*]\s+/.test(s)) {
          const govde = s.replace(/^[\-•*]\s+/, "");
          const ikiNoktaIdx = govde.indexOf(":");
          if (ikiNoktaIdx > 2 && ikiNoktaIdx <= 95) {
            const basVurgu = htmlGuvenliYap(govde.substring(0, ikiNoktaIdx + 1));
            const kalanMetin = htmlGuvenliYap(govde.substring(ikiNoktaIdx + 1).trim());
            html += `<div class="ozet-madde"><span class="ozet-madde-vurgu">${basVurgu}</span> ${kalanMetin}</div>`;
          } else {
            html += `<div class="ozet-madde">• ${htmlGuvenliYap(govde)}</div>`;
          }
          continue;
        }

        html += `<div class="ozet-paragraf">${htmlGuvenliYap(s)}</div>`;
      }
      return html;
    }

    function ozetIcerigiCiz() {
      const govdeEl = document.getElementById("ozetGovde");
      if (!sonCekilenPaket) return;
      govdeEl.innerHTML = ozetMetniniBicimlendir(sonCekilenPaket.icerik, sonCekilenPaket.zaman || "");
      altBarEtiketiniGuncelle();
    }

    async function ozetVerisiniCek(zorlaYenile, ev) {
      if (ev) ev.stopPropagation();
      if (ozetYukleniyor) return;
      const simdi = Date.now();
      if (!zorlaYenile && sonOzetCekimMs > 0 && (simdi - sonOzetCekimMs) < 30 * 1000 && sonCekilenPaket) {
        ozetIcerigiCiz();
        return;
      }
      ozetYukleniyor = true;
      const govdeEl = document.getElementById("ozetGovde");
      if (!sonCekilenPaket) {
        govdeEl.innerHTML = `<div class="ozet-bilgi-mesaj">⏳ Haber özeti okunuyor...</div>`;
      }
      try {
        const res = await fetch(API_URL + "?istek=ozet&t=" + Date.now(), { cache: "no-store" });
        const veri = await res.json();
        if (!veri.ok) throw new Error(veri.hata || veri.ozetHata || "Veri okunamadı");
        sonOzetCekimMs = Date.now();
        sonCekilenPaket = veri;
        ozetIcerigiCiz();
      } catch (err) {
        if (!sonCekilenPaket) {
          govdeEl.innerHTML = `<div class="ozet-bilgi-mesaj">⚠️ Okunamadı: ${htmlGuvenliYap(err.message || err)}</div>`;
        }
      } finally {
        ozetYukleniyor = false;
      }
    }

    function ozetCekmeceAc() {
      const cekmece = document.getElementById("ozetCekmece");
      const perde = document.getElementById("ozetPerde");
      cekmece.style.transform = "";
      perde.classList.add("acik");
      cekmece.classList.add("acik");
      ozetVerisiniCek(false);
    }

    function ozetCekmeceKapat(ev) {
      if (ev) ev.stopPropagation();
      const cekmece = document.getElementById("ozetCekmece");
      const perde = document.getElementById("ozetPerde");
      cekmece.style.transform = "";
      cekmece.classList.remove("acik");
      perde.classList.remove("acik");
    }

    function altBarTiklandi(ev) {
      if (ev) ev.stopPropagation();
      ozetCekmeceAc();
    }

    (function dokunmatikHareketleriKur() {
      const altBar = document.getElementById("ozetAltBar");
      const cekmece = document.getElementById("ozetCekmece");
      const cekmeceUst = document.getElementById("ozetCekmeceUst");
      const cekmeceGovde = document.getElementById("ozetGovde");

      let altBasY = null;
      altBar.addEventListener("touchstart", (e) => {
        altBasY = e.touches[0].clientY;
      }, { passive: true });

      altBar.addEventListener("touchend", (e) => {
        if (altBasY === null) return;
        const bitisY = e.changedTouches[0].clientY;
        if (altBasY - bitisY > 22) {
          ozetCekmeceAc();
        }
        altBasY = null;
      }, { passive: true });

      let ustBasY = null;
      let sonFarkY = 0;
      cekmeceUst.addEventListener("touchstart", (e) => {
        ustBasY = e.touches[0].clientY;
        sonFarkY = 0;
        cekmece.style.transition = "none";
      }, { passive: true });

      cekmeceUst.addEventListener("touchmove", (e) => {
        if (ustBasY === null) return;
        const fark = e.touches[0].clientY - ustBasY;
        if (fark > 0) {
          sonFarkY = fark;
          cekmece.style.transform = `translateY(${fark}px)`;
        }
      }, { passive: true });

      cekmeceUst.addEventListener("touchend", () => {
        cekmece.style.transition = "";
        if (sonFarkY > 75) {
          ozetCekmeceKapat();
        } else {
          cekmece.style.transform = "";
        }
        ustBasY = null;
        sonFarkY = 0;
      }, { passive: true });

      let govdeBasY = null;
      cekmeceGovde.addEventListener("touchstart", (e) => {
        govdeBasY = cekmeceGovde.scrollTop <= 0 ? e.touches[0].clientY : null;
      }, { passive: true });

      cekmeceGovde.addEventListener("touchend", (e) => {
        if (govdeBasY === null) return;
        const fark = e.changedTouches[0].clientY - govdeBasY;
        if (cekmeceGovde.scrollTop <= 0 && fark > 95) {
          ozetCekmeceKapat();
        }
        govdeBasY = null;
      }, { passive: true });
    })();

    veriyiCek();
    setTimeout(() => ozetVerisiniCek(false), 1500);
    setInterval(veriyiCek, YENILEME_SANIYE * 1000);
    setInterval(canliSureEtiketleriniGuncelle, 15000);
  </script>
</body>
</html>
