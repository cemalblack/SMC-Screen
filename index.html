    // =========================================================================
    // BİRLEŞİK YAPI, OB & POZİSYON HARİTASI (15dk + 60dk, MAKS 12 ZİKZAK)
    // =========================================================================
    function sayiCozHarita(deger) {
      if (deger === null || deger === undefined || deger === "") return null;
      if (typeof deger === "number") return (!isNaN(deger) && deger > 0) ? deger : null;
      let t = String(deger).trim().replace(/[^\d.,\-]/g, "");
      if (!t) return null;
      if (t.includes(".") && t.includes(",")) {
        t = t.replace(/\./g, "").replace(",", ".");
      } else if (t.includes(",")) {
        t = t.replace(",", ".");
      }
      const n = parseFloat(t);
      return (!isNaN(n) && n > 0) ? n : null;
    }

    function haritaFiyatFormatla(n, aralik) {
      if (n === null || n === undefined || isNaN(n)) return "-";
      if (n >= 1000) {
        if (aralik !== undefined && aralik < 15) {
          return n.toFixed(1);
        }
        return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      }
      if (n >= 100) {
        return (aralik !== undefined && aralik < 4) ? n.toFixed(2) : n.toFixed(1);
      }
      return n.toFixed(2);
    }

    function ob15SeviyeleriniCoz(metin, onEk, guncelFiyat) {
      const liste = [];
      if (!metin) return liste;
      const re = new RegExp(onEk + "([12])\\s*:\\s*([\\d.,]+)(?:\\s*\\(([^)]*)\\))?", "gi");
      let m;
      while ((m = re.exec(String(metin))) !== null) {
        const kademe = onEk.toUpperCase() + m[1];
        const fiyat = sayiCozHarita(m[2]);
        if (!fiyat) continue;
        const detay = m[3] || "";
        const mPct = detay.match(/%([+\-]?\d+(?:[.,]\d+)?)/);
        const mVol = detay.match(/H:\s*%(\d+)/i);
        let uzaklikPct = mPct ? Math.abs(parseFloat(mPct[1].replace(",", "."))) : null;
        if ((uzaklikPct === null || isNaN(uzaklikPct)) && guncelFiyat > 0) {
          uzaklikPct = Math.abs((fiyat - guncelFiyat) / guncelFiyat) * 100;
        }
        const hacimPct = mVol ? parseInt(mVol[1], 10) : null;
        liste.push({
          kod: kademe,
          fiyat: fiyat,
          uzaklikPct: uzaklikPct,
          hacimPct: (!isNaN(hacimPct) && hacimPct !== null) ? hacimPct : null,
          anaMi: m[1] === "1"
        });
      }
      return liste;
    }

    function ob60DuvarlariniCoz(ustMetin, guncelFiyat, destekMetin, direncMetin) {
      const sonuc = { d60: null, r60: null };
      const s = String(ustMetin || "");
      const mD = s.match(/(?:^|[\s|])D\s*:\s*([\d.,]+)(\s*\[1G\])?/i);
      const mR = s.match(/(?:^|[\s|0-9\]])R\s*:\s*([\d.,]+)(\s*\[1G\])?/i);
      if (mD) {
        const df = sayiCozHarita(mD[1]);
        if (df) {
          sonuc.d60 = {
            fiyat: df,
            uzaklikPct: guncelFiyat > 0 ? (Math.abs(df - guncelFiyat) / guncelFiyat) * 100 : null,
            sonKaleMi: Boolean(mD[2])
          };
        }
      } else if (destekMetin) {
        const mD1g = String(destekMetin).match(/1G\s*:\s*([\d.,]+)/i);
        const df = mD1g ? sayiCozHarita(mD1g[1]) : null;
        if (df) {
          sonuc.d60 = {
            fiyat: df,
            uzaklikPct: guncelFiyat > 0 ? (Math.abs(df - guncelFiyat) / guncelFiyat) * 100 : null,
            sonKaleMi: true
          };
        }
      }
      if (mR) {
        const rf = sayiCozHarita(mR[1]);
        if (rf) {
          sonuc.r60 = {
            fiyat: rf,
            uzaklikPct: guncelFiyat > 0 ? (Math.abs(rf - guncelFiyat) / guncelFiyat) * 100 : null,
            sonKaleMi: Boolean(mR[2])
          };
        }
      } else if (direncMetin) {
        const mR1g = String(direncMetin).match(/1G\s*:\s*([\d.,]+)/i);
        const rf = mR1g ? sayiCozHarita(mR1g[1]) : null;
        if (rf) {
          sonuc.r60 = {
            fiyat: rf,
            uzaklikPct: guncelFiyat > 0 ? (Math.abs(rf - guncelFiyat) / guncelFiyat) * 100 : null,
            sonKaleMi: true
          };
        }
      }
      return sonuc;
    }

    function pozisyonBayraklariniCoz(kayit, kategori, guncelFiyat) {
      const bayraklar = [];
      const etiket = String(kayit.etiket || "");
      const nobetci = String(kayit.nobetci || "");
      const birlesik = `${etiket} ${nobetci}`;

      // Sadece gerçek açık pozisyonlarda Giriş, SL ve TP gösterilir; RE nöbetlerinde SL/TP gösterilmez
      if (kategori === "acik") {
        const mG = etiket.match(/G:([\d.,]+)/i);
        const mSL = etiket.match(/SL:([\d.,]+)/i);
        const mTP = etiket.match(/TP:([\d.,]+)/i);
        const girisVal = mG ? sayiCozHarita(mG[1]) : null;
        const slVal = mSL ? sayiCozHarita(mSL[1]) : null;
        const tpVal = mTP ? sayiCozHarita(mTP[1]) : null;

        if (slVal) {
          bayraklar.push({ tip: "SL", onEk: "SL: ", fiyat: slVal, yaziRenk: "#b91c1c", bgRenk: "#fef2f2", kenarRenk: "#fca5a5", cizgiRenk: "#b91c1c", kesikli: true });
        }
        if (girisVal) {
          bayraklar.push({ tip: "GIRIS", onEk: "Giriş: ", fiyat: girisVal, yaziRenk: "#92400e", bgRenk: "#fffbeb", kenarRenk: "#fcd34d", cizgiRenk: "#d97706", kesikli: true });
        }
        if (tpVal) {
          bayraklar.push({ tip: "TP", onEk: "TP: ", fiyat: tpVal, yaziRenk: "#166534", bgRenk: "#dcfce7", kenarRenk: "#86efac", cizgiRenk: "#15803d", kesikli: true });
        }
      } else if (kategori === "re") {
        const mRE = birlesik.match(/RE:([\d.,]+)/i);
        const reVal = mRE ? sayiCozHarita(mRE[1]) : null;
        if (reVal) {
          bayraklar.push({ tip: "RE", onEk: "RE: ", fiyat: reVal, yaziRenk: "#3730a3", bgRenk: "#eef2ff", kenarRenk: "#a5b4fc", cizgiRenk: "#4f46e5", kesikli: true });
        }
      }

      if (guncelFiyat > 0) {
        bayraklar.push({ tip: "FIYAT", onEk: "", sonEk: " ●", fiyat: guncelFiyat, yaziRenk: "#ffffff", bgRenk: "#0284c7", kenarRenk: "#0284c7", cizgiRenk: "#0284c7", kesikli: false, anaFiyatMi: true });
      }
      return bayraklar;
    }

    // Ham 15dk mum dizisinden son ZIKZAK_PENCERE_MUM (90) barı tarayıp en fazla ZIKZAK_MAKS_NOKTA (12) zikzak çıkarır
    function mumdanZikzakCikar(bars, pencereMum, maksNokta) {
      if (!Array.isArray(bars) || bars.length === 0) return null;
      const altDizi = bars.length > pencereMum ? bars.slice(-pencereMum) : bars.slice();
      const temiz = altDizi
        .map(b => Array.isArray(b) ? { t: Number(b[0]) || 0, o: Number(b[1]), h: Number(b[2]), l: Number(b[3]), c: Number(b[4]) } : null)
        .filter(b => b && !isNaN(b.h) && !isNaN(b.l) && !isNaN(b.c) && b.c > 0);
      if (temiz.length === 0) return null;
      if (temiz.length === 1) {
        return { noktalar: [{ t: temiz[0].t, p: temiz[0].c }], baslangicSn: temiz[0].t, bitisSn: temiz[0].t, gercekMi: true };
      }

      let tumYuksek = -Infinity, tumDusuk = Infinity;
      for (const m of temiz) {
        if (m.h > tumYuksek) tumYuksek = m.h;
        if (m.l < tumDusuk) tumDusuk = m.l;
      }
      const aralikYuzde = tumDusuk > 0 ? ((tumYuksek - tumDusuk) / tumDusuk) * 100 : 1.0;
      const tabanEsik = Math.max(0.15, aralikYuzde * 0.08);

      let enIyi = null;
      for (let adim = 0; adim < 26; adim++) {
        const esik = tabanEsik * Math.pow(1.15, adim);
        const pivotlar = [];
        let trend = 0;
        let sonHI = 0, sonH = temiz[0].h;
        let sonLI = 0, sonL = temiz[0].l;

        for (let i = 0; i < temiz.length; i++) {
          const h = temiz[i].h, l = temiz[i].l;
          if (trend === 0) {
            if (h > sonH) { sonH = h; sonHI = i; }
            if (l < sonL) { sonL = l; sonLI = i; }
            if (sonL > 0 && ((sonH - sonL) / sonL) * 100 >= esik) {
              if (sonHI > sonLI) {
                pivotlar.push({ i: sonLI, t: temiz[sonLI].t, p: sonL });
                trend = 1;
              } else {
                pivotlar.push({ i: sonHI, t: temiz[sonHI].t, p: sonH });
                trend = -1;
              }
            }
          } else if (trend === 1) {
            if (h >= sonH) {
              sonH = h; sonHI = i;
            } else if (sonH > 0 && ((sonH - l) / sonH) * 100 >= esik) {
              pivotlar.push({ i: sonHI, t: temiz[sonHI].t, p: sonH });
              sonL = l; sonLI = i;
              trend = -1;
            }
          } else if (trend === -1) {
            if (l <= sonL) {
              sonL = l; sonLI = i;
            } else if (sonL > 0 && ((h - sonL) / sonL) * 100 >= esik) {
              pivotlar.push({ i: sonLI, t: temiz[sonLI].t, p: sonL });
              sonH = h; sonHI = i;
              trend = 1;
            }
          }
        }

        if (trend === 1 && (pivotlar.length === 0 || pivotlar[pivotlar.length - 1].i !== sonHI)) {
          pivotlar.push({ i: sonHI, t: temiz[sonHI].t, p: sonH });
        } else if (trend === -1 && (pivotlar.length === 0 || pivotlar[pivotlar.length - 1].i !== sonLI)) {
          pivotlar.push({ i: sonLI, t: temiz[sonLI].t, p: sonL });
        }

        const sonIdx = temiz.length - 1;
        if (pivotlar.length === 0) {
          pivotlar.push({ i: 0, t: temiz[0].t, p: temiz[0].o || temiz[0].c });
          pivotlar.push({ i: sonIdx, t: temiz[sonIdx].t, p: temiz[sonIdx].c });
        } else if (pivotlar[pivotlar.length - 1].i !== sonIdx) {
          pivotlar.push({ i: sonIdx, t: temiz[sonIdx].t, p: temiz[sonIdx].c });
        } else {
          pivotlar[pivotlar.length - 1] = { i: sonIdx, t: temiz[sonIdx].t, p: temiz[sonIdx].c };
        }

        enIyi = pivotlar;
        if (pivotlar.length <= maksNokta) break;
      }

      if (enIyi.length > maksNokta) {
        enIyi = enIyi.slice(-maksNokta);
      }
      return {
        noktalar: enIyi.map(x => ({ t: x.t, p: x.p })),
        baslangicSn: enIyi[0].t || 0,
        bitisSn: enIyi[enIyi.length - 1].t || 0,
        gercekMi: true
      };
    }

    function kayittanZikzakHazirla(kayit, guncelFiyat, gunlukPct) {
      // 1) Ham 15dk mumları geldiyse (son 90 mum -> maks 12 zikzak)
      const hamMumlar = kayit.mumlar15 || kayit.bars15;
      if (Array.isArray(hamMumlar) && hamMumlar.length >= 2) {
        const cikarilan = mumdanZikzakCikar(hamMumlar, ZIKZAK_PENCERE_MUM, ZIKZAK_MAKS_NOKTA);
        if (cikarilan && cikarilan.noktalar.length >= 2) return cikarilan;
      }

      // 2) doGet'ten hazır zikzak dizisi geldiyse (maks 12 nokta sınırını uygula)
      const hazirDizi = kayit.zikzak15 || kayit.zikzak;
      if (Array.isArray(hazirDizi) && hazirDizi.length >= 2) {
        let cozulen = hazirDizi.map(el => {
          if (typeof el === "number") return { t: 0, p: el };
          if (Array.isArray(el) && el.length >= 2) return { t: Number(el[0]) || 0, p: Number(el[1]) };
          if (el && typeof el === "object") return { t: Number(el.t || el.zaman || 0), p: Number(el.p || el.fiyat || el.c) };
          return null;
        }).filter(x => x && !isNaN(x.p) && x.p > 0);

        if (cozulen.length >= 2) {
          if (cozulen.length > ZIKZAK_MAKS_NOKTA) {
            cozulen = cozulen.slice(-ZIKZAK_MAKS_NOKTA);
          }
          if (guncelFiyat > 0) {
            cozulen[cozulen.length - 1].p = guncelFiyat;
          }
          let basSn = cozulen[0].t || 0;
          if (!basSn && (kayit.zikzakBaslangicSn || kayit.zikzakBaslangic)) {
            const ms = zamanMsCoz(kayit.zikzakBaslangicSn || kayit.zikzakBaslangic);
            if (ms) basSn = Math.floor(ms / 1000);
          }
          const bitSn = cozulen[cozulen.length - 1].t || Math.floor(Date.now() / 1000);
          return { noktalar: cozulen, baslangicSn: basSn, bitisSn: bitSn, gercekMi: true };
        }
      }

      // 3) doGet henüz güncellenmediyse günlük değişim ve iç dalgadan sembolik gün içi eğri üret
      if (guncelFiyat > 0) {
        const pct = (!isNaN(gunlukPct) && gunlukPct !== null) ? gunlukPct : 0;
        const dunKapanis = Math.abs(1 + pct / 100) > 0.01 ? (guncelFiyat / (1 + pct / 100)) : guncelFiyat;
        const icStr = String(kayit.icDalga || "");
        const icLong = /Long/i.test(icStr) || icStr.includes("↗");
        const icShort = /Short/i.test(icStr) || icStr.includes("↘");
        const fark = Math.abs(guncelFiyat - dunKapanis) || (guncelFiyat * 0.004);
        let araNokta = (dunKapanis + guncelFiyat) / 2;
        if (icLong) araNokta = Math.min(dunKapanis, guncelFiyat) - fark * 0.25;
        else if (icShort) araNokta = Math.max(dunKapanis, guncelFiyat) + fark * 0.25;

        return {
          noktalar: [
            { t: 0, p: dunKapanis },
            { t: 0, p: araNokta },
            { t: 0, p: guncelFiyat }
          ],
          baslangicSn: 0,
          bitisSn: Math.floor(Date.now() / 1000),
          gercekMi: false
        };
      }
      return { noktalar: [], baslangicSn: 0, bitisSn: 0, gercekMi: false };
    }

    function tsiTakvimGunuAnahtari(sn) {
      const tsiMs = (sn * 1000) + (3 * 3600 * 1000);
      const d = new Date(tsiMs);
      return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    }

    function zikzakBaslangicEtiketiUret(baslangicSn, bitisSn, gercekMi) {
      if (!gercekMi || !baslangicSn || baslangicSn <= 0) {
        return "Dün Kapanış";
      }
      const basSaniye = baslangicSn > 1e11 ? Math.floor(baslangicSn / 1000) : baslangicSn;
      const referansSn = Math.max(
        Math.floor(Date.now() / 1000),
        bitisSn > 1e11 ? Math.floor(bitisSn / 1000) : (bitisSn || 0)
      );
      const farkSn = Math.max(0, referansSn - basSaniye);
      const farkSaat = farkSn / 3600;
      const gunFarki = Math.round((tsiTakvimGunuAnahtari(referansSn) - tsiTakvimGunuAnahtari(basSaniye)) / 86400000);

      if (farkSaat < 1) {
        const dk = Math.max(1, Math.round(farkSn / 60));
        return `${dk} dk önce`;
      }
      if (gunFarki <= 0 || farkSaat < 18) {
        return `${Math.max(1, Math.round(farkSaat))} saat önce`;
      }
      return `${Math.max(1, gunFarki)} gün önce`;
    }

    function dikeyEtiketCakismaCoz(ogeler, minAralikPx, ustSinirPx, altSinirPx) {
      if (!ogeler || ogeler.length <= 1) return ogeler;
      ogeler.sort((a, b) => a.yEtiket - b.yEtiket);
      for (let tur = 0; tur < 8; tur++) {
        let degisti = false;
        for (let i = 1; i < ogeler.length; i++) {
          const ust = ogeler[i - 1];
          const alt = ogeler[i];
          const fark = alt.yEtiket - ust.yEtiket;
          if (fark < minAralikPx) {
            const kaydir = (minAralikPx - fark) / 2;
            ust.yEtiket -= kaydir;
            alt.yEtiket += kaydir;
            degisti = true;
          }
        }
        for (let i = 0; i < ogeler.length; i++) {
          if (ogeler[i].yEtiket < ustSinirPx) ogeler[i].yEtiket = ustSinirPx;
          if (ogeler[i].yEtiket > altSinirPx) ogeler[i].yEtiket = altSinirPx;
        }
        if (!degisti) break;
      }
      return ogeler;
    }

    function birlesikHaritaSvgUret(kartKaydi) {
      const p = kartKaydi.veri || {};
      const kategori = kartKaydi.kategori;
      const fiyatStr = String(p.fiyat || "");
      const mFiyat = fiyatStr.match(/^\s*([\d.,]+)/);
      const mPct = fiyatStr.match(/\(%?([+\-]?\d+(?:[.,]\d+)?)\)/);
      const guncelFiyat = mFiyat ? sayiCozHarita(mFiyat[1]) : null;
      const gunlukPct = mPct ? parseFloat(mPct[1].replace(",", ".")) : 0;

      if (!guncelFiyat) {
        return {
          svg: `<div class="ozet-bilgi-mesaj">Bu enstrüman için güncel fiyat verisi henüz bulunmuyor.</div>`,
          tamVeriVar: false
        };
      }

      const d15Liste = ob15SeviyeleriniCoz(p.destek, "D", guncelFiyat);
      const r15Liste = ob15SeviyeleriniCoz(p.direnc, "R", guncelFiyat);
      const ustMetin = String(p.ustYapi || p.tf2Ozet || p.ustYon || "");
      const ob60 = ob60DuvarlariniCoz(ustMetin, guncelFiyat, p.destek, p.direnc);
      const bayraklar = pozisyonBayraklariniCoz(p, kategori, guncelFiyat);
      const zzVeri = kayittanZikzakHazirla(p, guncelFiyat, gunlukPct);
      const zzNoktalar = zzVeri.noktalar;

      // Çekirdek görünüm aralığını hesapla (aşırı uzaktaki dış duvarların grafiği ezmesini engelle)
      const cekirdekHavuz = [guncelFiyat, ...zzNoktalar.map(z => z.p)];
      bayraklar.forEach(b => cekirdekHavuz.push(b.fiyat));
      d15Liste.filter(d => d.anaMi).forEach(d => cekirdekHavuz.push(d.fiyat));
      r15Liste.filter(r => r.anaMi).forEach(r => cekirdekHavuz.push(r.fiyat));

      let cekMin = Math.min(...cekirdekHavuz);
      let cekMax = Math.max(...cekirdekHavuz);
      if (cekMax - cekMin < guncelFiyat * 0.008) {
        const esne = guncelFiyat * 0.008;
        cekMin -= esne;
        cekMax += esne;
      }
      const cekAralik = cekMax - cekMin;
      const disSinirAlt = cekMin - cekAralik * 1.45;
      const disSinirUst = cekMax + cekAralik * 1.45;
      const sonKaleSinirAlt = Math.min(disSinirAlt, guncelFiyat * 0.95);
      const sonKaleSinirUst = Math.max(disSinirUst, guncelFiyat * 1.05);

      const tumGorunurHavuz = [...cekirdekHavuz];
      const disSeviyeler = [
        ...d15Liste.filter(d => !d.anaMi).map(d => ({ f: d.fiyat, sk: false })),
        ...r15Liste.filter(r => !r.anaMi).map(r => ({ f: r.fiyat, sk: false }))
      ];
      if (ob60.d60) disSeviyeler.push({ f: ob60.d60.fiyat, sk: Boolean(ob60.d60.sonKaleMi) });
      if (ob60.r60) disSeviyeler.push({ f: ob60.r60.fiyat, sk: Boolean(ob60.r60.sonKaleMi) });

      for (const sv of disSeviyeler) {
        const altLim = sv.sk ? sonKaleSinirAlt : disSinirAlt;
        const ustLim = sv.sk ? sonKaleSinirUst : disSinirUst;
        if (sv.f >= altLim && sv.f <= ustLim) {
          tumGorunurHavuz.push(sv.f);
        }
      }

      let hamMin = Math.min(...tumGorunurHavuz);
      let hamMax = Math.max(...tumGorunurHavuz);
      const bazAralik = Math.max(hamMax - hamMin, guncelFiyat * 0.01);
      const yMin = hamMin - bazAralik * 0.13;
      const yMax = hamMax + bazAralik * 0.13;
      const yAralik = yMax - yMin;

      // SVG Koordinat Sistemi ve 2 Kademeli Büyütme Çarpanı (Aa / Aa+ / Aa++)
      const yaziKat = aktifHaritaKademe === 2 ? 1.28 : (aktifHaritaKademe === 1 ? 1.14 : 1.0);
      const W = 396;
      const H = Math.round(338 + aktifHaritaKademe * 26);
      const solX = 8;
      const sagX = aktifHaritaKademe === 2 ? 325 : (aktifHaritaKademe === 1 ? 332 : 338);
      const ustY = Math.round(16 * yaziKat);
      const altY = H - Math.round(46 * (1 + aktifHaritaKademe * 0.08));
      const cizimBoy = altY - ustY;

      const yHesapla = (fiyat) => {
        const oran = (fiyat - yMin) / yAralik;
        const hamY = altY - oran * cizimBoy;
        return Math.max(ustY + 4, Math.min(altY - 4, hamY));
      };
      const yKistiMi = (fiyat) => (fiyat < yMin ? "alt" : fiyat > yMax ? "ust" : "");

      let parcalar = [];

      // 1) Yatay Izgara & Sağ Y-Ekseni Fiyat Kademeleri (5 kademe)
      const eksenFont = (9.5 * yaziKat).toFixed(1);
      for (let i = 0; i <= 4; i++) {
        const kOran = i / 4;
        const kFiyat = yMin + kOran * yAralik;
        const ky = altY - kOran * cizimBoy;
        parcalar.push(`<line x1="${solX}" y1="${ky.toFixed(1)}" x2="${sagX}" y2="${ky.toFixed(1)}" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.7" />`);
        parcalar.push(`<line x1="${sagX}" y1="${ky.toFixed(1)}" x2="${sagX + 3.5}" y2="${ky.toFixed(1)}" stroke="#94a3b8" stroke-width="1" />`);
        parcalar.push(`<text x="${sagX + 5.5}" y="${(ky + 3.2 * yaziKat).toFixed(1)}" font-size="${eksenFont}" font-weight="700" fill="#64748b">${haritaFiyatFormatla(kFiyat, yAralik)}</text>`);
      }

      // Sağ ve Alt Ana Eksen Çizgileri
      parcalar.push(`<line x1="${sagX}" y1="${ustY}" x2="${sagX}" y2="${altY}" stroke="#cbd5e1" stroke-width="1.1" />`);
      parcalar.push(`<line x1="${solX}" y1="${altY}" x2="${sagX}" y2="${altY}" stroke="#94a3b8" stroke-width="1.3" />`);

      // 2) 15dk Destek ve Direnç Order Block Bantları + Sol Etiketler
      const solEtiketler = [];
      const bantKalinlik = Math.max(8, Math.round(cizimBoy * 0.033));
      const solFont = (9.4 * yaziKat).toFixed(1);

      d15Liste.forEach(d => {
        const y = yHesapla(d.fiyat);
        const kisti = yKistiMi(d.fiyat);
        const alpha = d.anaMi
          ? (d.hacimPct !== null ? (0.11 + (Math.min(100, d.hacimPct) / 100) * 0.17) : 0.17)
          : 0.10;
        const yBantUst = y;
        const yBantAlt = Math.min(altY, y + bantKalinlik);
        if (!kisti) {
          parcalar.push(`<rect x="${solX}" y="${yBantUst.toFixed(1)}" width="${sagX - solX}" height="${Math.max(4, yBantAlt - yBantUst).toFixed(1)}" fill="#22c55e" fill-opacity="${alpha.toFixed(2)}" />`);
        }
        const dash = d.anaMi ? "" : `stroke-dasharray="2.5,2.5"`;
        const kalin = d.anaMi ? "1.5" : "1.1";
        parcalar.push(`<line x1="${solX}" y1="${y.toFixed(1)}" x2="${sagX}" y2="${y.toFixed(1)}" stroke="#16a34a" stroke-width="${kalin}" ${dash} opacity="0.9" />`);

        const pctKisim = d.uzaklikPct !== null ? `%${d.uzaklikPct.toFixed(1)}` : "";
        const volKisim = d.hacimPct !== null ? ` | H:%${d.hacimPct}${d.hacimPct >= 50 ? " Güçlü" : ""}` : "";
        const parantez = (pctKisim || volKisim) ? ` (${pctKisim}${volKisim})` : "";
        const okOnEk = kisti === "alt" ? "▼ " : "";
        solEtiketler.push({
          metin: `${okOnEk}[15dk ${d.kod}] ${haritaFiyatFormatla(d.fiyat, yAralik)}${parantez}`,
          renk: "#15803d",
          yEtiket: d.anaMi ? Math.min(altY - 6, yBantAlt + 10 * yaziKat) : Math.max(ustY + 10 * yaziKat, y - 5)
        });
      });

      r15Liste.forEach(r => {
        const y = yHesapla(r.fiyat);
        const kisti = yKistiMi(r.fiyat);
        const alpha = r.anaMi
          ? (r.hacimPct !== null ? (0.11 + (Math.min(100, r.hacimPct) / 100) * 0.17) : 0.17)
          : 0.10;
        const yBantAlt = y;
        const yBantUst = Math.max(ustY, y - bantKalinlik);
        if (!kisti) {
          parcalar.push(`<rect x="${solX}" y="${yBantUst.toFixed(1)}" width="${sagX - solX}" height="${Math.max(4, yBantAlt - yBantUst).toFixed(1)}" fill="#ef4444" fill-opacity="${alpha.toFixed(2)}" />`);
        }
        const dash = r.anaMi ? "" : `stroke-dasharray="2.5,2.5"`;
        const kalin = r.anaMi ? "1.4" : "1.1";
        parcalar.push(`<line x1="${solX}" y1="${y.toFixed(1)}" x2="${sagX}" y2="${y.toFixed(1)}" stroke="#dc2626" stroke-width="${kalin}" ${dash} opacity="0.88" />`);

        const pctKisim = r.uzaklikPct !== null ? `%${r.uzaklikPct.toFixed(1)}` : "";
        const volKisim = r.hacimPct !== null ? ` | H:%${r.hacimPct}${r.hacimPct >= 50 ? " Güçlü" : ""}` : "";
        const parantez = (pctKisim || volKisim) ? ` (${pctKisim}${volKisim})` : "";
        const okOnEk = kisti === "ust" ? "▲ " : "";
        solEtiketler.push({
          metin: `${okOnEk}[15dk ${r.kod}] ${haritaFiyatFormatla(r.fiyat, yAralik)}${parantez}`,
          renk: "#dc2626",
          yEtiket: Math.max(ustY + 10 * yaziKat, yBantUst - 4)
        });
      });

      // 3) 60dk Ana Duvarlar ve [1G SON KALE] Duvarları (Kalın Kesikli Hat + Orta Kapsül)
      const maksSagBayrakGen = Math.round(72 * yaziKat);
      const bayrakSolX = sagX - maksSagBayrakGen - 3;
      const ortaFont = (9.1 * yaziKat).toFixed(1);
      const ortaKutuBoy = 16.4 * yaziKat;

      const ortaDuvarCiz = (duvarObj, etiketOnEk, varsayilanRenk, xMerkez) => {
        if (!duvarObj) return;
        const y = yHesapla(duvarObj.fiyat);
        const kisti = yKistiMi(duvarObj.fiyat);
        const ok = kisti === "ust" ? "▲ " : kisti === "alt" ? "▼ " : "";
        const pctMetin = duvarObj.uzaklikPct !== null ? ` (%${duvarObj.uzaklikPct.toFixed(1)})` : "";
        const sonKaleMi = Boolean(duvarObj.sonKaleMi);
        const cizgiRenk = sonKaleMi ? (etiketOnEk === "D" ? "#b45309" : "#c2410c") : varsayilanRenk;
        const baslikKisim = sonKaleMi ? `[1G SON KALE ${etiketOnEk}]` : `[60dk ${etiketOnEk}]`;
        const tamMetin = `${ok}${baslikKisim} ${haritaFiyatFormatla(duvarObj.fiyat, yAralik)}${pctMetin}`;
        const kutuGen = Math.max(Math.round(84 * yaziKat), Math.round(tamMetin.length * 5.35 * yaziKat + 12));
        const kutuSolX = Math.max(solX + 6, Math.min((bayrakSolX - 4) - kutuGen, xMerkez - kutuGen / 2));
        const yaziMerkezX = kutuSolX + kutuGen / 2;

        if (sonKaleMi && !kisti) {
          const bantY = etiketOnEk === "D" ? y : Math.max(ustY, y - 8);
          const bantH = etiketOnEk === "D" ? Math.max(3, Math.min(8, altY - y)) : Math.max(3, y - bantY);
          const bantRenk = etiketOnEk === "D" ? "#f59e0b" : "#ea580c";
          parcalar.push(`<rect x="${solX}" y="${bantY.toFixed(1)}" width="${sagX - solX}" height="${bantH.toFixed(1)}" fill="${bantRenk}" fill-opacity="0.14" />`);
        }

        const dashDesen = sonKaleMi ? "8.5,3.5" : "7,4.5";
        const cizgiKalin = sonKaleMi ? "2.3" : "2.1";
        parcalar.push(`<line x1="${solX}" y1="${y.toFixed(1)}" x2="${sagX}" y2="${y.toFixed(1)}" stroke="${cizgiRenk}" stroke-width="${cizgiKalin}" stroke-dasharray="${dashDesen}" opacity="0.94" />`);
        parcalar.push(`<rect x="${kutuSolX.toFixed(1)}" y="${(y - ortaKutuBoy / 2).toFixed(1)}" width="${kutuGen}" height="${ortaKutuBoy.toFixed(1)}" rx="4.5" fill="${cizgiRenk}" />`);
        parcalar.push(`<text x="${yaziMerkezX.toFixed(1)}" y="${(y + 3.4 * yaziKat).toFixed(1)}" text-anchor="middle" font-size="${ortaFont}" font-weight="800" fill="#ffffff">${htmlGuvenliYap(tamMetin)}</text>`);
      };

      ortaDuvarCiz(ob60.r60, "R", "#991b1b", 174);
      ortaDuvarCiz(ob60.d60, "D", "#065f46", 164);

      // Sol 15dk etiketlerini dikey çakışmasız çiz
      dikeyEtiketCakismaCoz(solEtiketler, 13.8 * yaziKat, ustY + 10 * yaziKat, altY - 6);
      const solKutuBoy = 12.6 * yaziKat;
      solEtiketler.forEach(et => {
        const tahminiGen = Math.min(sagX - 24, Math.round(et.metin.length * 5.25 * yaziKat + 7));
        parcalar.push(`<rect x="${solX + 2}" y="${(et.yEtiket - 9.6 * yaziKat).toFixed(1)}" width="${tahminiGen}" height="${solKutuBoy.toFixed(1)}" rx="3" fill="#ffffff" fill-opacity="0.84" />`);
        parcalar.push(`<text x="${solX + 4}" y="${et.yEtiket.toFixed(1)}" font-size="${solFont}" font-weight="800" fill="${et.renk}">${htmlGuvenliYap(et.metin)}</text>`);
      });

      // 4) Zikzak Fiyat Yapısı + Dikey Başlangıç İz Düşümü + Alt Eksen Çentiği
      const zzSolX = 86;
      const zzSagX = bayraklar.length > 1 ? (bayrakSolX - 22) : (bayrakSolX - 10);
      const nZz = zzNoktalar.length;

      if (nZz >= 2) {
        const zzKoord = zzNoktalar.map((pt, idx) => ({
          x: zzSolX + (idx / (nZz - 1)) * (zzSagX - zzSolX),
          y: yHesapla(pt.p),
          p: pt.p
        }));

        const ilkNokta = zzKoord[0];
        const sonNokta = zzKoord[zzKoord.length - 1];
        const sondanOnceki = zzKoord[zzKoord.length - 2];

        // İlk noktadan alt eksene dikey noktalı iz düşümü + çentik + dinamik "X gün önce" rozeti
        const altRozetFont = (9.5 * yaziKat).toFixed(1);
        const altRozetBoy = Math.round(17 * yaziKat);
        const basEtiket = zikzakBaslangicEtiketiUret(zzVeri.baslangicSn, zzVeri.bitisSn, zzVeri.gercekMi);
        const basRozetGen = Math.max(Math.round(54 * yaziKat), Math.round(basEtiket.length * 5.6 * yaziKat + 12));
        parcalar.push(`<line x1="${ilkNokta.x.toFixed(1)}" y1="${ilkNokta.y.toFixed(1)}" x2="${ilkNokta.x.toFixed(1)}" y2="${altY}" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2.5,3.5" opacity="0.8" />`);
        parcalar.push(`<line x1="${ilkNokta.x.toFixed(1)}" y1="${altY - 4}" x2="${ilkNokta.x.toFixed(1)}" y2="${altY + 5}" stroke="#334155" stroke-width="2" />`);
        parcalar.push(`<circle cx="${ilkNokta.x.toFixed(1)}" cy="${altY}" r="3.2" fill="#334155" />`);
        parcalar.push(`<rect x="${(ilkNokta.x - basRozetGen / 2).toFixed(1)}" y="${altY + 8}" width="${basRozetGen}" height="${altRozetBoy}" rx="4.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />`);
        parcalar.push(`<text x="${ilkNokta.x.toFixed(1)}" y="${(altY + 8 + altRozetBoy * 0.69).toFixed(1)}" text-anchor="middle" font-size="${altRozetFont}" font-weight="800" fill="#334155">${htmlGuvenliYap(basEtiket)}</text>`);

        // Son noktadan ("Şimdi") alt eksene ince mavi iz düşümü
        parcalar.push(`<line x1="${sonNokta.x.toFixed(1)}" y1="${sonNokta.y.toFixed(1)}" x2="${sonNokta.x.toFixed(1)}" y2="${altY}" stroke="#0284c7" stroke-width="1.1" stroke-dasharray="2.5,3.5" opacity="0.6" />`);
        parcalar.push(`<circle cx="${sonNokta.x.toFixed(1)}" cy="${altY}" r="2.9" fill="#0284c7" />`);
        parcalar.push(`<text x="${sonNokta.x.toFixed(1)}" y="${(altY + 8 + altRozetBoy * 0.69).toFixed(1)}" text-anchor="middle" font-size="${altRozetFont}" font-weight="800" fill="#0369a1">Şimdi</text>`);

        // Ana Zikzak Çizgisi (Son aktif dalga mavi, önceki dalgalar koyu antrasit)
        if (zzKoord.length > 2) {
          const gecmisNoktalarStr = zzKoord.slice(0, -1).map(k => `${k.x.toFixed(1)},${k.y.toFixed(1)}`).join(" ");
          parcalar.push(`<polyline points="${gecmisNoktalarStr}" fill="none" stroke="#334155" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />`);
        }
        parcalar.push(`<line x1="${sondanOnceki.x.toFixed(1)}" y1="${sondanOnceki.y.toFixed(1)}" x2="${sonNokta.x.toFixed(1)}" y2="${sonNokta.y.toFixed(1)}" stroke="#0284c7" stroke-width="2.7" stroke-linecap="round" />`);

        // Zikzak Köşe Düğümleri
        for (let i = 0; i < zzKoord.length - 1; i++) {
          const k = zzKoord[i];
          if (i === 0) {
            parcalar.push(`<circle cx="${k.x.toFixed(1)}" cy="${k.y.toFixed(1)}" r="3.8" fill="#334155" />`);
          } else {
            parcalar.push(`<circle cx="${k.x.toFixed(1)}" cy="${k.y.toFixed(1)}" r="3.2" fill="#ffffff" stroke="#334155" stroke-width="1.7" />`);
          }
        }
        parcalar.push(`<circle cx="${sonNokta.x.toFixed(1)}" cy="${sonNokta.y.toFixed(1)}" r="4.8" fill="#0284c7" />`);

        // İlk nokta, En Yüksek Tepe ve En Düşük Dip fiyat etiketleri
        const pivFont = (9.2 * yaziKat).toFixed(1);
        let enYuksekIdx = 0, enDusukIdx = 0;
        for (let i = 0; i < zzKoord.length - 1; i++) {
          if (zzKoord[i].p > zzKoord[enYuksekIdx].p) enYuksekIdx = i;
          if (zzKoord[i].p < zzKoord[enDusukIdx].p) enDusukIdx = i;
        }
        const isaretlenecekIndeksler = new Set([0, enYuksekIdx, enDusukIdx]);
        isaretlenecekIndeksler.forEach(idx => {
          const k = zzKoord[idx];
          const komsuY = idx < zzKoord.length - 1 ? zzKoord[idx + 1].y : zzKoord[idx - 1].y;
          const tepeMi = k.y <= komsuY;
          const yaziY = tepeMi ? Math.max(ustY + 10 * yaziKat, k.y - 6.5) : Math.min(altY - 5, k.y + 12.5 * yaziKat);
          parcalar.push(`<text x="${k.x.toFixed(1)}" y="${yaziY.toFixed(1)}" text-anchor="middle" font-size="${pivFont}" font-weight="800" fill="#0f172a">${haritaFiyatFormatla(k.p, yAralik)}</text>`);
        });

        // 5) Sağ Kısa Bayraklar (Giriş / SL / TP / RE ve Güncel Fiyat)
        const sagBayraklar = bayraklar.map(b => {
          const yGercek = yHesapla(b.fiyat);
          const metin = `${b.onEk || ""}${haritaFiyatFormatla(b.fiyat, yAralik)}${b.sonEk || ""}`;
          return {
            ...b,
            metin: metin,
            yGercek: yGercek,
            yEtiket: yGercek,
            basX: b.anaFiyatMi ? sonNokta.x : Math.min(sondanOnceki.x + 8, sonNokta.x - 6)
          };
        });

        const bayrakKutuBoy = 16.4 * yaziKat;
        const bayrakFont = (9.3 * yaziKat).toFixed(1);
        dikeyEtiketCakismaCoz(sagBayraklar, 18.6 * yaziKat, ustY + 10 * yaziKat, altY - 10 * yaziKat);

        sagBayraklar.forEach(b => {
          const dash = b.kesikli ? `stroke-dasharray="4,2.8"` : "";
          const kirilmaX = bayrakSolX - 7;
          if (Math.abs(b.yEtiket - b.yGercek) > 1.5) {
            parcalar.push(`<polyline points="${b.basX.toFixed(1)},${b.yGercek.toFixed(1)} ${kirilmaX},${b.yGercek.toFixed(1)} ${bayrakSolX},${b.yEtiket.toFixed(1)}" fill="none" stroke="${b.cizgiRenk}" stroke-width="1.5" ${dash} />`);
          } else {
            parcalar.push(`<line x1="${b.basX.toFixed(1)}" y1="${b.yGercek.toFixed(1)}" x2="${bayrakSolX}" y2="${b.yEtiket.toFixed(1)}" stroke="${b.cizgiRenk}" stroke-width="1.5" ${dash} />`);
          }
          const kutuGen = Math.min(maksSagBayrakGen, Math.max(Math.round(48 * yaziKat), Math.round(b.metin.length * 5.5 * yaziKat + 11)));
          parcalar.push(`<rect x="${bayrakSolX}" y="${(b.yEtiket - bayrakKutuBoy / 2).toFixed(1)}" width="${kutuGen}" height="${bayrakKutuBoy.toFixed(1)}" rx="4.5" fill="${b.bgRenk}" stroke="${b.kenarRenk}" stroke-width="1.1" />`);
          parcalar.push(`<text x="${(bayrakSolX + kutuGen / 2).toFixed(1)}" y="${(b.yEtiket + 3.3 * yaziKat).toFixed(1)}" text-anchor="middle" font-size="${bayrakFont}" font-weight="800" fill="${b.yaziRenk}">${htmlGuvenliYap(b.metin)}</text>`);
        });
      }

      const svgTam = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Birleşik Yapı ve OB Haritası">${parcalar.join("")}</svg>`;
      const sonKaleVarMi = Boolean((ob60.d60 && ob60.d60.sonKaleMi) || (ob60.r60 && ob60.r60.sonKaleMi));
      return {
        svg: svgTam,
        gercekZikzakMi: zzVeri.gercekMi,
        ustDuvarVarMi: Boolean(ob60.d60 || ob60.r60),
        sonKaleVarMi: sonKaleVarMi
      };
    }

    function haritaIceriginiCiz(kartKaydi) {
      if (!kartKaydi) return;
      const p = kartKaydi.veri || {};
      const ad = kartKaydi.ad || "";
      const kategori = kartKaydi.kategori;
      const etiket = String(p.etiket || "");

      const baslikEl = document.getElementById("haritaBaslik");
      const lejantEl = document.getElementById("haritaLejant");
      const svgAlaniEl = document.getElementById("haritaSvgAlani");
      const altNotEl = document.getElementById("haritaAltNot");

      const sonuc = birlesikHaritaSvgUret(kartKaydi);
      const skBilgi = sonuc.sonKaleVarMi ? " / 1G Son Kale" : "";

      if (kategori === "acik") {
        const yon = /SHORT/i.test(etiket) ? "SHORT" : "LONG";
        baslikEl.textContent = `${ad} (${yon}) — Yapı, OB & Pozisyon Haritası`;
        lejantEl.className = "harita-lejant harita-lejant-acik";
        lejantEl.innerHTML = `
          <span>■ Bant: 15dk OB | - - Kesikli: 60dk${skBilgi}</span>
          <span style="color:#b45309">Sağ Bayraklar: Giriş / SL / TP</span>
        `;
      } else if (kategori === "re") {
        const reYon = /RE-SHORT/i.test(etiket) ? "RE-SHORT" : "RE-LONG";
        baslikEl.textContent = `${ad} (${reYon}) — Yapı, OB & RE Haritası`;
        lejantEl.className = "harita-lejant harita-lejant-re";
        lejantEl.innerHTML = `
          <span>■ Bant: 15dk OB | - - Kesikli: 60dk${skBilgi}</span>
          <span style="color:#3730a3">Sağ Bayrak: RE Giriş</span>
        `;
      } else {
        baslikEl.textContent = sonuc.sonKaleVarMi
          ? `${ad} — Birleşik Yapı & OB Haritası (15dk + 60dk + 1G)`
          : `${ad} — Birleşik Yapı & OB Haritası (15dk + 60dk)`;
        lejantEl.className = "harita-lejant harita-lejant-sabit";
        lejantEl.innerHTML = sonuc.sonKaleVarMi
          ? `<span>■ Bant: 15dk OB | - - 60dk Duvar</span><span style="color:#b45309">- - Kehribar: 1G Son Kale</span>`
          : `<span>■ Renkli Bant: 15dk OB (Hacim %'li)</span><span style="color:#991b1b">- - Kalın Kesikli Hat: 60dk Ana Duvar</span>`;
      }

      svgAlaniEl.innerHTML = sonuc.svg;

      if (sonuc.gercekZikzakMi) {
        altNotEl.textContent = "İlk noktadan inen dikey iz düşümü ve alt eksen çentiği, zikzağın kaç gün/saat önce başladığını dinamik gösterir (maks. 12 nokta).";
      } else {
        altNotEl.textContent = "Mevcut 15dk OB ve pozisyon seviyeleri gösteriliyor. Tam 12 noktalı zikzak ve 60dk duvarları Apps Script doGet güncellendiğinde otomatik aktifleşir.";
      }
    }

    function haritaPopAc(kartIdx, ev) {
      if (ev) ev.stopPropagation();
      const kartKaydi = ekranKartlari[kartIdx];
      if (!kartKaydi) return;
      aktifHaritaAnahtar = kartKaydi.anahtar;
      haritaIceriginiCiz(kartKaydi);
      document.getElementById("haritaPerde").classList.add("acik");
    }

    function haritaPopKapat(ev) {
      if (ev) ev.stopPropagation();
      aktifHaritaAnahtar = null;
      document.getElementById("haritaPerde").classList.remove("acik");
    }

    function hisseKartiOlustur(kayitPaketi) {
      const h = kayitPaketi.veri;
      const ad = kayitPaketi.kod;
      const sb = kayitPaketi.sinifBilgi;
      const haritaKategori = h.pozDurum === "acik" ? "acik" : (h.pozDurum === "re" ? "re" : "ana");
      const kartIdx = ekranKartlari.push({
        kategori: haritaKategori,
        ad: ad,
        anahtar: "tumu_" + ad,
        veri: h
      }) - 1;

      const tlFiyat = hisseTlFiyatAyikla(h.fiyat);
      const rozetHtml = ucluRozetHtmlUret(h);
      const rsHtml = rsEkHtmlUret(h.vwapAlfa);
      const degisimHtml = gunlukDegisimHtmlUret(h.fiyat, kartIdx, rsHtml);
      const viopMakasHtml = viopMakasBilgiHtmlUret(h);
      const icRenk = icDalgaRenkSinifi(h.icDalga);

      const sagRozetler = [];
      if (h.pozDurum === "acik") {
        sagRozetler.push(`<span class="hisse-durum-etiket durum-acik">💼 AÇIK</span>`);
      } else if (h.pozDurum === "re") {
        sagRozetler.push(`<span class="hisse-durum-etiket durum-re">📌 RE</span>`);
      }
      if (sb.rozetMetin) {
        sagRozetler.push(`<span class="hisse-durum-etiket ${sb.rozetSinif}">${htmlGuvenliYap(sb.rozetMetin)}</span>`);
      }

      let altSatirMetin = "";
      let altSatirRenk = "";
      if (h.alarmMetin) {
        altSatirMetin = h.alarmMetin;
        altSatirRenk = /SHORT|SAT-/i.test(h.alarmMetin) ? "renk-kirmizi" : (/LONG|AL-/i.test(h.alarmMetin) ? "renk-yesil" : "renk-sari");
      } else if (h.pusu && h.pusu !== "Nötr" && h.pusu !== "-") {
        altSatirMetin = h.pusu;
        if (h.pusu.startsWith("🎯")) {
          altSatirRenk = /SAT-/i.test(h.pusu) ? "renk-kirmizi" : "renk-yesil";
        } else if (h.pusu.startsWith("⏳") || h.pusu.includes("[Emilim]")) {
          altSatirRenk = "renk-sari";
        }
      }

      const kart = document.createElement("div");
      kart.className = `kart ${sb.cerceve}`;
      kart.innerHTML = `
        <div class="ust-satir">
          <div class="sembol-grup">
            <span class="sembol-baslik">${htmlGuvenliYap(ad)}</span>
            ${tlFiyat ? `<span class="hisse-fiyat-metin">${htmlGuvenliYap(tlFiyat)}</span>` : ""}
            ${rozetHtml}
          </div>
          ${sagRozetler.length > 0 ? `<div class="hisse-etiket-sag">${sagRozetler.join("")}</div>` : ""}
        </div>
        ${degisimHtml}
        ${viopMakasHtml}
        <div class="ic-dalga-satir ${icRenk}">${htmlGuvenliYap(h.icDalga || "-")}</div>
        ${altSatirMetin ? `<div class="alt-bilgi-satir ${altSatirRenk}">${htmlGuvenliYap(altSatirMetin)}</div>` : ""}
      `;
      return kart;
    }

    function tumuListesiniCiz(veri, hazirOzet) {
      const govdeEl = document.getElementById("tumuGovde");
      const baslikEl = document.getElementById("tumuAnaBaslik");
      const altBilgiEl = document.getElementById("tumuAltBilgi");
      if (!govdeEl) return;

      const oncekiScroll = govdeEl.scrollTop;
      const ozet = hazirOzet || tumHisseleriHazirla(veri || sonAnaVeriPaketi || {});
      const hisseHamZaman = (veri && (veri.hisseZaman || veri.zaman)) || "";
      const sureMetin = hisseHamZaman ? gecenSureMetni(hisseHamZaman) : "";

      if (baslikEl) {
        baslikEl.textContent = ozet.toplam > 0 ? `📊 BIST 30 Tümü (${ozet.toplam})` : "📊 BIST 30 Tümü";
      }
      if (altBilgiEl) {
        if (hisseHamZaman) {
          altBilgiEl.setAttribute("data-zaman", String(hisseHamZaman));
          altBilgiEl.setAttribute("data-onek", "Alarm / Pusu üstte • A–Z · ");
          altBilgiEl.textContent = sureMetin ? `Alarm / Pusu üstte • A–Z · ${sureMetin}` : "Alarm / Pusu üstte • A–Z";
        } else {
          altBilgiEl.textContent = "Alarm / Pusu üstte • Diğerleri A–Z";
        }
      }

      govdeEl.innerHTML = "";

      if (!ozet.doGetGuncelMi) {
        const bilgi = document.createElement("div");
        bilgi.className = "nakit-serit";
        bilgi.textContent = "ℹ️ Tüm hesaplanan BIST 30 hisselerinin listelenmesi için Apps Script'te SMC Motor v3.4 kodunu 'Yeni sürüm' olarak dağıtın.";
        govdeEl.appendChild(bilgi);
      }

      if (ozet.toplam === 0) {
        const bos = document.createElement("div");
        bos.className = "ozet-bilgi-mesaj";
        bos.textContent = "Henüz hesaplanmış BIST 30 hisse verisi bulunmuyor.";
        govdeEl.appendChild(bos);
        return;
      }

      if (ozet.alarmPusuGrubu.length > 0) {
        bolumBasligiEkle(govdeEl, `🎯 Alarm & Pusu Hattındakiler (${ozet.alarmPusuGrubu.length})`, "ilk", "");
        ozet.alarmPusuGrubu.forEach(item => {
          govdeEl.appendChild(hisseKartiOlustur(item));
        });
      }

      if (ozet.alfabetikGrup.length > 0) {
        const baslikMetni = ozet.alarmPusuGrubu.length > 0
          ? `📋 Diğer Hisseler — A–Z (${ozet.alfabetikGrup.length})`
          : `📋 Tüm Hisseler — A–Z (${ozet.alfabetikGrup.length})`;
        bolumBasligiEkle(govdeEl, baslikMetni, ozet.alarmPusuGrubu.length > 0 ? "" : "ilk", "");
        ozet.alfabetikGrup.forEach(item => {
          govdeEl.appendChild(hisseKartiOlustur(item));
        });
      }

      if (tumuAcikMi && oncekiScroll > 0) {
        govdeEl.scrollTop = oncekiScroll;
      }
    }

    function tumuCekmeceAc(ev) {
      if (ev) ev.stopPropagation();
      const katman = document.getElementById("tumuCekmece");
      if (!katman) return;
      katman.style.transform = "";
      katman.classList.add("acik");
      katman.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      if (!tumuAcikMi && window.history && window.history.pushState) {
        try {
          window.history.pushState({ katman: "tumu" }, "");
          tumuHistoryItildiMi = true;
        } catch (_) {}
      }
      tumuAcikMi = true;
    }

    function tumuCekmeceKapatDahili() {
      const katman = document.getElementById("tumuCekmece");
      if (!katman) return;
      katman.style.transform = "";
      katman.classList.remove("acik");
      katman.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      tumuAcikMi = false;
    }

    function tumuCekmeceKapat(ev) {
      if (ev) ev.stopPropagation();
      tumuCekmeceKapatDahili();
      if (tumuHistoryItildiMi && window.history && window.history.back) {
        tumuHistoryItildiMi = false;
        try { window.history.back(); } catch (_) {}
      }
    }

    window.addEventListener("popstate", () => {
      if (aktifHaritaAnahtar) {
        haritaPopKapat();
        return;
      }
      if (tumuAcikMi) {
        tumuHistoryItildiMi = false;
        tumuCekmeceKapatDahili();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (aktifHaritaAnahtar) {
          haritaPopKapat();
        } else if (tumuAcikMi) {
          tumuCekmeceKapat();
        }
      }
    });

    // =========================================================================
    // HABER ÖZETİ / ÖZET STRATEJİ ÇEKMECESİ (BİST 30 & ONS SEKMELERİ KALDIRILDI)
    // =========================================================================
    function ozetMetniniBicimlendir(hamMetin, ozetHamZaman) {
      if (!hamMetin) return `<div class="ozet-bilgi-mesaj">Özet metni bulunamadı.</div>`;
      const satirlar = String(hamMetin).split("\n");
      const hamBaslikIndeksleri = [];
      const temizSatirlar = [];

      for (const hamSatir of satirlar) {
        const s = hamSatir.trim();
        if (!s) continue;
        const yildizsiz = s.replace(/\*/g, "").trim();
        const buyukBaslikMi = (/^[A-ZÇĞİÖŞÜ0-9\s/()\-]{4,55}:?$/.test(yildizsiz) && !yildizsiz.startsWith("-"));
        const temizMetin = buyukBaslikMi ? yildizsiz : s;
        if (buyukBaslikMi) hamBaslikIndeksleri.push(temizSatirlar.length);
        temizSatirlar.push({ metin: temizMetin, baslikMi: buyukBaslikMi });
      }

      // Öncelikle "ÖZET STRATEJİ" satırını, yoksa ilk büyük bölüm başlığını bul
      let hedefSureSatirIdx = -1;
      for (const idx of hamBaslikIndeksleri) {
        if (/ÖZET\s*STRATEJ/i.test(temizSatirlar[idx].metin)) {
          hedefSureSatirIdx = idx;
          break;
        }
      }
      if (hedefSureSatirIdx === -1 && hamBaslikIndeksleri.length > 0) {
        hedefSureSatirIdx = hamBaslikIndeksleri[0];
      }

      const sureMetin = ozetHamZaman ? gecenSureMetni(ozetHamZaman) : "";
      let html = "";

      // Eğer metinde hiç büyük başlık yoksa en üste ÖZET STRATEJİ şeridi koy
      if (hedefSureSatirIdx === -1 && ozetHamZaman) {
        html += `
          <div class="ozet-bolum-baslik ozet-bolum-baslik-esnek">
            <span>ÖZET STRATEJİ</span>
            <span class="ozet-strateji-sure" data-zaman="${htmlGuvenliYap(ozetHamZaman)}" data-onek="">${sureMetin}</span>
          </div>
        `;
      }

      for (let i = 0; i < temizSatirlar.length; i++) {
        const s = temizSatirlar[i].metin;
        if (temizSatirlar[i].baslikMi) {
          const baslikTemiz = htmlGuvenliYap(s.replace(/:$/, ""));
          if (i === hedefSureSatirIdx && ozetHamZaman) {
            html += `
              <div class="ozet-bolum-baslik ozet-bolum-baslik-esnek">
                <span>${baslikTemiz}</span>
                <span class="ozet-strateji-sure" data-zaman="${htmlGuvenliYap(ozetHamZaman)}" data-onek="">${sureMetin}</span>
              </div>
            `;
          } else {
            html += `<div class="ozet-bolum-baslik">${baslikTemiz}</div>`;
          }
          continue;
        }

        if (/^[\-•*]\s+/.test(s)) {
          const govde = s.replace(/^[\-•*]\s+/, "");
          const ikiNoktaIdx = govde.indexOf(":");
          if (ikiNoktaIdx > 2 && ikiNoktaIdx <= 95) {
            const basVurgu = htmlGuvenliYap(govde.substring(0, ikiNoktaIdx + 1));
            const kalanMetin = htmlGuvenliYap(govde.substring(ikiNoktaIdx + 1).trim());
            html += `<div class="ozet-madde"><span class="ozet-madde-vurgu">${basVurgu}</span> ${kalanMetin}</div>`;
          } else {
            html += `<div class="ozet-madde">• ${htmlGuvenliYap(govde)}</div>`;
          }
          continue;
        }

        html += `<div class="ozet-paragraf">${htmlGuvenliYap(s)}</div>`;
      }
      return html;
    }

    function ozetIcerigiCiz() {
      const govdeEl = document.getElementById("ozetGovde");
      if (!sonCekilenPaket) return;
      govdeEl.innerHTML = ozetMetniniBicimlendir(sonCekilenPaket.icerik, sonCekilenPaket.zaman || "");
      altBarEtiketiniGuncelle();
    }

    async function ozetVerisiniCek(zorlaYenile, ev) {
      if (ev) ev.stopPropagation();
      if (ozetYukleniyor) return;
      const simdi = Date.now();
      if (!zorlaYenile && sonOzetCekimMs > 0 && (simdi - sonOzetCekimMs) < 30 * 1000 && sonCekilenPaket) {
        ozetIcerigiCiz();
        return;
      }
      ozetYukleniyor = true;
      const govdeEl = document.getElementById("ozetGovde");
      if (!sonCekilenPaket) {
        govdeEl.innerHTML = `<div class="ozet-bilgi-mesaj">⏳ Haber özeti okunuyor...</div>`;
      }
      try {
        const res = await fetch(API_URL + "?istek=ozet&t=" + Date.now(), { cache: "no-store" });
        const veri = await res.json();
        if (!veri.ok) throw new Error(veri.hata || veri.ozetHata || "Veri okunamadı");
        sonOzetCekimMs = Date.now();
        sonCekilenPaket = veri;
        ozetIcerigiCiz();
      } catch (err) {
        if (!sonCekilenPaket) {
          govdeEl.innerHTML = `<div class="ozet-bilgi-mesaj">⚠️ Okunamadı: ${htmlGuvenliYap(err.message || err)}</div>`;
        }
      } finally {
        ozetYukleniyor = false;
      }
    }

    function ozetCekmeceAc() {
      const cekmece = document.getElementById("ozetCekmece");
      const perde = document.getElementById("ozetPerde");
      cekmece.style.transform = "";
      perde.classList.add("acik");
      cekmece.classList.add("acik");
      ozetVerisiniCek(false);
    }

    function ozetCekmeceKapat(ev) {
      if (ev) ev.stopPropagation();
      const cekmece = document.getElementById("ozetCekmece");
      const perde = document.getElementById("ozetPerde");
      cekmece.style.transform = "";
      cekmece.classList.remove("acik");
      perde.classList.remove("acik");
    }

    function altBarTiklandi(ev) {
      if (ev) ev.stopPropagation();
      ozetCekmeceAc();
    }

    (function dokunmatikHareketleriKur() {
      const altBar = document.getElementById("ozetAltBar");
      const cekmece = document.getElementById("ozetCekmece");
      const cekmeceUst = document.getElementById("ozetCekmeceUst");
      const cekmeceGovde = document.getElementById("ozetGovde");

      let altBasY = null;
      altBar.addEventListener("touchstart", (e) => {
        altBasY = e.touches.length === 1 ? e.touches[0].clientY : null;
      }, { passive: true });

      altBar.addEventListener("touchend", (e) => {
        if (altBasY === null || e.touches.length > 0) { altBasY = null; return; }
        const bitisY = e.changedTouches[0].clientY;
        if (altBasY - bitisY > 22) {
          ozetCekmeceAc();
        }
        altBasY = null;
      }, { passive: true });

      let ustBasY = null;
      let sonFarkY = 0;
      cekmeceUst.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) { ustBasY = null; return; }
        ustBasY = e.touches[0].clientY;
        sonFarkY = 0;
        cekmece.style.transition = "none";
      }, { passive: true });

      cekmeceUst.addEventListener("touchmove", (e) => {
        if (ustBasY === null || e.touches.length !== 1) {
          ustBasY = null; sonFarkY = 0; cekmece.style.transform = ""; return;
        }
        const fark = e.touches[0].clientY - ustBasY;
        if (fark > 0) {
          sonFarkY = fark;
          cekmece.style.transform = `translateY(${fark}px)`;
        }
      }, { passive: true });

      cekmeceUst.addEventListener("touchend", () => {
        cekmece.style.transition = "";
        if (sonFarkY > 75) {
          ozetCekmeceKapat();
        } else {
          cekmece.style.transform = "";
        }
        ustBasY = null;
        sonFarkY = 0;
      }, { passive: true });

      let govdeBasY = null;
      cekmeceGovde.addEventListener("touchstart", (e) => {
        govdeBasY = (e.touches.length === 1 && cekmeceGovde.scrollTop <= 0) ? e.touches[0].clientY : null;
      }, { passive: true });

      cekmeceGovde.addEventListener("touchmove", (e) => {
        if (e.touches.length > 1) govdeBasY = null;
      }, { passive: true });

      cekmeceGovde.addEventListener("touchend", (e) => {
        if (govdeBasY === null) return;
        const fark = e.changedTouches[0].clientY - govdeBasY;
        if (cekmeceGovde.scrollTop <= 0 && fark > 95) {
          ozetCekmeceKapat();
        }
        govdeBasY = null;
      }, { passive: true });

      const tumuKatman = document.getElementById("tumuCekmece");
      const tumuUst = document.getElementById("tumuCekmeceUst");
      let tumuBasY = null;
      let tumuFarkY = 0;
      if (tumuKatman && tumuUst) {
        tumuUst.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) { tumuBasY = null; return; }
          tumuBasY = e.touches[0].clientY;
          tumuFarkY = 0;
          tumuKatman.style.transition = "none";
        }, { passive: true });

        tumuUst.addEventListener("touchmove", (e) => {
          if (tumuBasY === null || e.touches.length !== 1) {
            tumuBasY = null; tumuFarkY = 0; tumuKatman.style.transform = ""; return;
          }
          const fark = e.touches[0].clientY - tumuBasY;
          if (fark > 0) {
            tumuFarkY = fark;
            tumuKatman.style.transform = `translateY(${fark}px)`;
          }
        }, { passive: true });

        tumuUst.addEventListener("touchend", () => {
          tumuKatman.style.transition = "";
          if (tumuFarkY > 75) {
            tumuCekmeceKapat();
          } else {
            tumuKatman.style.transform = "";
          }
          tumuBasY = null;
          tumuFarkY = 0;
        }, { passive: true });
      }
    })();

    veriyiCek();
    setTimeout(() => ozetVerisiniCek(false), 1500);
    setInterval(veriyiCek, YENILEME_SANIYE * 1000);
    setInterval(canliSureEtiketleriniGuncelle, 15000);
  </script>
</body>
